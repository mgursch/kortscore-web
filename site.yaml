    fr: shot-play-fr.webp
    it: shot-play-it.webp
    es: shot-play-es.webp
  shot-live:
    en: shot-live-en.webp
    de: shot-live-de.webp
    fr: shot-live-fr.webp
    it: shot-live-it.webp
    es: shot-live-es.webp
  shot-stats:
