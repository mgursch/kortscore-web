    de: shot-stats-de.webp
    fr: shot-stats-fr.webp
    it: shot-stats-it.webp
    es: shot-stats-es.webp
  shot-ios-play:
    en: shot-ios-play-en.webp
    de: shot-ios-play-de.webp
    fr: shot-ios-play-fr.webp
    it: shot-ios-play-it.webp
    es: shot-ios-play-es.webp
  shot-ios-live:
