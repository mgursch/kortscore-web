name: Deploy to GitHub Pages

# Statische Seite ohne Build-Schritt: das Repo-Root wird 1:1 veröffentlicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufendes Deployment nicht abbrechen, damit eine Veröffentlichung nicht halb fertig bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # include-hidden-files ist Pflicht, seit v5 Punkt-Dateien standardmaessig
      # ausschliesst: .nojekyll schaltet die Jekyll-Verarbeitung ab, und
      # .well-known/assetlinks.json traegt die App-Link-Verifikation, ohne die
      # Kortscore-Deeplinks im Browser statt in der App landen. .git und .github
      # bleiben in jedem Fall aussen vor, dafuer sorgt die Action selbst.
      # tools/ enthaelt das Apps Script und seine Anleitung. Beides gehoert ins
      # Repo, aber nicht auf die Website: veroeffentlicht wird nur, was
      # Besucher brauchen.
      - run: rm -rf tools

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
