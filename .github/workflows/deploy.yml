name: Deploy to GitHub Pages

# build.py erzeugt die Seite aus templates/, i18n/ und static/ nach _site/,
# veröffentlicht wird nur dieser Ordner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufendes Deployment nicht abbrechen, damit eine Veröffentlichung nicht halb fertig bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install 'jinja2>=3.1,<4' 'pyyaml>=6,<7'

      # Bricht ab, wenn ein Text, eine Seite oder ein Asset fehlt.
      - run: python build.py

      # Interne Links, hreflang, Sitemap und JSON-LD: lieber kein Deployment
      # als eines mit toten Links.
      - run: python tools/check_site.py

      # Hochgeladen wird nur _site/, Quelle, tools/ und Doku bleiben im Repo.
      # include-hidden-files ist Pflicht, seit v5 Punkt-Dateien standardmaessig
      # ausschliesst: .nojekyll schaltet die Jekyll-Verarbeitung ab, und
      # .well-known/assetlinks.json traegt die App-Link-Verifikation, ohne die
      # Kortscore-Deeplinks im Browser statt in der App landen.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
