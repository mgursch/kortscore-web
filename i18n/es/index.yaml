steps:
  title: Cómo funciona
  list:
    - title: Inicia el partido
      body: >-
        Elige un formato o toca sin más la última combinación. Individual,
        dobles, NoAd, al mejor de tres, un solo set: todo vale.
    - title: Juega y toca
      body: >-
        El reloj cuenta puntos, juegos y sets según las reglas reales del tenis
        y del pádel, con tie-break y súper tie-break incluidos.
    - title: Analiza y comparte
      body: >-
        El partido llega solo a tu historial en el móvil, con el resultado en
        notación televisiva, la duración y el registro de puntos.

padel:
  eyebrow: También para pádel
  title: ¿Pádel? Se cuenta igual.
  lead: >-
    El pádel se cuenta como el tenis: 15, 30, 40, juego, set. Por eso Kortscore
    no necesita nada especial: el reloj simplemente lleva la cuenta. Un toque
    por punto, en la pista, sin interrumpir el juego.
  count: ["15", "30", "40", Juego, Set]
  facts:
    - term: Punto de oro
      text: >-
        Integrado en la app como NoAd. Elígelo una vez y, con 40:40, el
        siguiente punto decide el juego, tal y como se juega en tu liga.
    - term: Dobles
      text: >-
        El pádel casi siempre se juega por parejas, y en Kortscore los dobles
        no son un caso especial, sino uno de los formatos de la pantalla de
        inicio.
    - term: En directo para espectadores
      text: >-
        Comparte el enlace y quien esté fuera de la pista sigue cada punto,
        desde la pista de al lado o desde casa.

