meta:
  title: "Kortscore: marcador de tenis y pádel para Apple Watch y Wear OS"
  description: Lleva la cuenta de tus partidos de tenis y pádel con un toque en tu Apple Watch o reloj Wear OS. Gratis, con marcador en directo para espectadores, estadísticas e historial de partidos.
  og_title: "Kortscore: tu partido, tu marcador, un toque."

# Zeile in llms.txt.
llms: Página de inicio (español)

hero:
  title: Tu partido. <br>Tu marcador. <br><em>Un toque.</em>
  lede: >-
    Kortscore lleva la cuenta de tu partido de tenis o pádel en la muñeca,
    punto por punto, sin interrumpir el juego. Y quien no está en la pista lo
    sigue en directo.
  cta: Descargar la app →
  platforms: Gratis para Apple Watch y Wear OS, con iPhone o móvil Android.
  watch_alt: Kortscore en un reloj Wear OS con el marcador actual

# Der Tippcode als ein Block. Die Zeichen 1× bis 4× stehen in der Vorlage.
tap:
  title: El código de toques
  lede: >-
    Tocas en cualquier parte de la pantalla, sin mirar. Los juegos, sets y
    tie-breaks los calcula el reloj.
  codes:
    - Punto para ti
    - Punto para tu rival
    - Dar el último punto al otro lado
    - Deshacer el último punto
  after: >-
    Individual o dobles, ventaja o NoAd, al mejor de tres sets o un set: lo
    eliges antes del primer punto. Tras el punto de partido, el partido queda
    en el historial del móvil, con su duración y el registro punto a punto.
  watch_alt: Kortscore en un Apple Watch con 40-15

clubs:
  title: Todo el club <br>lo sigue en directo
  lead: >-
    En una jornada de liga se juegan varios partidos a la vez, y nadie puede
    estar en todas partes. Con el marcador en directo, el equipo, el capitán y
    la afición siguen cada partido en tiempo real: desde la pista de al lado,
    desde la cafetería del club o desde casa.
  points:
    - "Basta con compartir el enlace: los espectadores no necesitan app ni registrarse."
    - Marcador, historial de sets y saque en directo, punto por punto.
  offer: >-
    Colgad nuestro folleto en vuestro club y vuestros socios tendrán Kortscore
    Plus más barato.
  offer_link: La oferta para clubes
  # Beispiel einer Ticker-Ansicht, keine echten Daten.
  ticker:
    label: Liga, jornada 4
    home: Local
    away: Visitante
    live: En directo
    done: Terminado
    serve: Al saque
    matches:
      - Individual 1, pista 1
      - Individual 2, pista 2
      - Dobles 1, pista 3

padel:
  title: Pádel con punto de oro
  lead: >-
    El pádel se cuenta como el tenis: 15, 30, 40, juego, set. En Kortscore el
    punto de oro es un interruptor: activado, con 40-40 decide el siguiente
    punto.
  link: Cómo se cuenta en pádel

watches:
  title: Relojes para la pista
  lede: ¿Aún sin reloj? Estos cuatro aguantan un partido largo y se leen bien al sol.
  all: Los cuatro relojes en detalle
  compatible: Todos los modelos compatibles
  notes:
    apple: Para iPhone
    galaxy: Wear OS 6
    ultra: Gran batería
    pixel: Compacto

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Preguntas frecuentes
  questions:
    - q: ¿Necesito el móvil en la pista?
      a: >-
        No. El reloj lleva la cuenta completamente solo, incluso sin conexión.
        Solo el marcador en directo necesita el móvil dentro del alcance
        Bluetooth, porque es el móvil el que envía el marcador a Internet. Con
        el wifi o el LTE del reloj no basta.
    - q: ¿Qué relojes funcionan con Kortscore?
      a: >-
        Cualquier Apple Watch con watchOS 26 o posterior, es decir, Series 6,
        SE a partir de la segunda generación, Ultra y modelos más recientes,
        enlazado con un iPhone. Y cualquier reloj con Wear OS 3 o posterior, es
        decir, Samsung Galaxy Watch a partir del Watch 4, Google Pixel Watch y
        otros, enlazado con un móvil con Android 8 o posterior. La lista
        completa de modelos está en la <a href="{url:compatible}">página de
        compatibilidad</a>.
    - q: ¿Sigue Kortscore las reglas reales, con tie-break y NoAd?
      a: >-
        Sí. Ventaja o NoAd, sets a 6 o a 4 juegos, tie-break y súper tie-break,
        al mejor de tres sets o un solo set. Las reglas en detalle:
        <a href="{url:tennis}">puntuación en tenis</a>,
        <a href="{url:padel}">puntuación en pádel</a>.
    - q: ¿Cómo funciona el marcador en directo?
      a: >-
        Compartes un enlace desde la app. Quien lo abre ve el marcador, el
        historial de sets y quién saca en el navegador. Para ello, tu móvil
        tiene que estar dentro del alcance Bluetooth del reloj.
    - q: ¿Cuánto cuesta Kortscore?
      a: >-
        Nada. La cuenta de puntos, el marcador en directo y tus 10 partidos más
        recientes son gratis, sin anuncios y sin registro, igual en iPhone que
        en Android. Kortscore Plus es una compra única y añade el historial
        completo de partidos con el registro punto a punto, estadísticas
        detalladas, copias de seguridad automáticas y el Kortscore Trainer
        (IA), que analiza tus partidos.
    - q: ¿Hay Kortscore para iPhone y Apple Watch?
      a: >-
        Sí. La app viene del App Store y tiene una app para Apple Watch para
        contar, con los mismos formatos y el mismo código de toques que en Wear
        OS. Una diferencia: en el Apple Watch el partido se registra como
        entrenamiento, así la pantalla sigue encendida durante el juego.
    - q: ¿Funciona Kortscore en iPad y Mac?
      a: >-
        Sí. La app Kortscore del App Store también funciona en el iPad con
        iPadOS 18 o posterior y en los Mac con chip de Apple y macOS 15 o
        posterior, en una ventana de tamaño ajustable. El historial de partidos,
        las estadísticas y el marcador en directo tienen ahí una pantalla más
        grande. Para contar en la muñeca sigue haciendo falta el iPhone, porque
        Apple solo enlaza el Apple Watch con un iPhone.
    - q: ¿Puedo pasarme de Android a iPhone y llevarme mis partidos?
      a: >-
        Sí, con la copia de seguridad de la app: crea una copia de seguridad en
        el dispositivo antiguo, cárgala en el nuevo y listo. Funciona en ambos
        sentidos. Por ahora no hay una cuenta de Kortscore que sincronice los
        datos a través de la nube.

cta:
  title: Para iPhone y Android
  lede: El reloj cuenta, el móvil guarda el historial.
  hint: "Requisitos: iOS y iPadOS 18 o posterior, macOS 15 o posterior (chip de Apple), watchOS 26 o posterior, Android 8.0 o posterior, Wear OS 3 o posterior."

# JSON-LD SoftwareApplication (nur im Quelltext, nicht sichtbar).
app:
  alternate_name: "Kortscore: Tenis y pádel"
  description: Kortscore lleva la cuenta en tenis y pádel con un toque en tu Apple Watch o reloj Wear OS. Gratis, con marcador en directo para espectadores, estadísticas e historial de partidos en iPhone y Android.
  features:
    - Cuenta los puntos con un toque en el reloj
    - Tenis y pádel, individual y dobles
    - Ventaja y NoAd, tie-breaks, sets a 4 o 6 juegos
    - Marcador en directo con un enlace para compartir, sin app para los espectadores
    - Estadísticas del partido e historial punto por punto
    - Sin anuncios, sin registro
