# Regelseite Tennis. Gerüst in templates/partials/rules.html.
# meta.title und meta.description stehen auch im Article-JSON-LD.

meta:
  title: ¿Cómo se cuenta en el tenis? Puntos, juegos, sets y tie-break explicados
  description: "La puntuación del tenis, explicada de forma sencilla: 15, 30, 40, iguales y ventaja, NoAd, juegos y sets, tie-break y súper tie-break, orden de saque y cambios de lado."
  og_title: ¿Cómo se cuenta en el tenis?

breadcrumb: Puntuación en tenis
llms: Cómo se cuenta en el tenis (reglas explicadas)
# Article-JSON-LD "about".
about: Tenis

title: Puntuación en tenis
lead: >-
  Los puntos se llaman 15, 30 y 40, un juego exige dos puntos de diferencia,
  un set, seis juegos, y con 6:6 llega el tie-break.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Puntos: 0, 15, 30, 40"
    text:
      - >-
        Cada juego empieza con 0:0. El primer punto vale 15, el segundo 30, el
        tercero 40. Quien está en 40 y gana el siguiente punto se lleva el
        juego, salvo que el rival también esté en 40.
      - >-
        El tanteo del que saca se canta siempre primero: 30:15 significa que
        va ganando el sacador.
  - title: "Iguales: tras 40:40, dos puntos seguidos"
    text:
      - >-
        Con 40:40, el marcador está en iguales. El siguiente punto da la
        ventaja y el que viene después, el juego. Si quien tiene la ventaja
        pierde el punto, se vuelve a iguales. En teoría, un juego puede durar
        eternamente.
    demo: deuce
    note: >-
      Cuenta puntos desde iguales hasta que se decida el juego. El interruptor
      cambia a NoAd.
  - title: "NoAd: con 40:40 decide un punto"
    text:
      - >-
        Muchas ligas, torneos de club y los dobles profesionales juegan NoAd,
        abreviatura de «no advantage» (sin ventaja): con 40:40, el siguiente
        punto decide el juego, y el restador elige desde qué lado resta. Así
        los partidos son más cortos y previsibles. En pádel, la misma regla se
        llama punto de oro.
      - >-
        En Kortscore eliges NoAd una vez al empezar y el reloj cuenta en
        consecuencia.
  - title: "Sets: seis juegos con dos de diferencia"
    text:
      - >-
        Un set lo gana quien llega primero a seis juegos con al menos dos de
        diferencia: con 6:4 se gana el set, con 6:5 no. Con 6:5 se sigue
        jugando, y con 7:5 se gana.
      - >-
        Los sets cortos se juegan a 4 juegos. La regla de la ITF fija el
        tie-break con 4:4 y admite 3:3 como alternativa. Kortscore lo juega
        con 3:3, como en FAST4: así, un set corto termina 4:0, 4:1, 4:2 o,
        tras un tie-break a 7, 4:3.
      - >-
        Un partido suele jugarse al mejor de tres sets; los Grand Slams
        masculinos, al mejor de cinco.
  - title: "Tie-break con 6:6: gana quien llega a 7 puntos"
    text:
      - >-
        En el tie-break, también llamado muerte súbita, los puntos se cuentan
        de uno en uno: 1, 2, 3, etc. Quien llega primero a siete puntos, con
        dos de diferencia, gana el tie-break y el set, que se anota como 7:6.
      - >-
        El saque cambia tras el primer punto y después cada dos puntos; los
        jugadores cambian de lado cada seis puntos.
    demo: tiebreak
    note: >-
      El tie-break va 5:4. Sigue contando hasta que se decida el set.
  - title: "Súper tie-break a 10 puntos en lugar del tercer set"
    text:
      - >-
        Muchos torneos de dobles y de club sustituyen el tercer set por un
        súper tie-break a 10 puntos, también con dos de diferencia. El
        resultado queda entonces, por ejemplo, 6-3 4-6 [10-7].
      - >-
        Kortscore conoce los dos: tie-break a 7 y súper tie-break a 10.
  - title: "El saque cambia cada juego, los lados con suma impar de juegos"
    text:
      - >-
        El saque se alterna después de cada juego. En individual, quien sacó
        en el primer juego vuelve a sacar en el tercero. En dobles, los
        compañeros se turnan, así que el primer sacador vuelve a sacar en el
        quinto juego.
      - >-
        Los jugadores cambian de lado tras el primer, el tercer y el quinto
        juego, es decir, siempre que la suma de juegos es impar; y tras un set
        con un número par de juegos, solo después del primer juego del set
        siguiente.
  - title: "Anotar el resultado: set a set, desde el punto de vista del ganador"
    text:
      - >-
        6-4 3-6 7-6(4) significa tres sets, y el tercero se decidió en un
        tie-break ganado 7-4.
      - >-
        Kortscore anota el resultado en tu historial exactamente así, con la
        duración y el registro punto por punto.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Preguntas frecuentes
  questions:
    - q: ¿Por qué los puntos se llaman 15, 30 y 40?
      a: >-
        Nadie lo sabe con certeza. La explicación más extendida es una esfera
        de reloj marcada en los cuartos, 15, 30 y 45, en la que el 45 se
        acortó a 40 porque se canta más rápido. Lo único que importa es el
        orden.
    - q: ¿Qué significa «love»?
      a: >-
        «Love» es la palabra inglesa para cero, y 0:0 se dice «love all».
        Probablemente viene del francés «l'œuf», el huevo, por la forma del
        cero. En español se dice «nada» (quince nada), y un juego en el que el
        perdedor no gana ni un punto es un juego en blanco.
    - q: ¿Quién saca después del tie-break?
      a: >-
        Quien sacó el primer punto del tie-break resta en el primer juego del
        set siguiente. La rotación sigue sin más, como si el tie-break hubiera
        sido un juego.

cta:
  title: Contar con Kortscore
  text: >-
    Tocas una vez por punto; iguales, ventaja y rotación del saque en el
    tie-break los calcula la app siguiendo exactamente estas reglas.
