# Regelseite Padel. Gerüst in templates/partials/rules.html.
# meta.title und meta.description stehen auch im Article-JSON-LD.

meta:
  title: ¿Cómo se cuenta en el pádel? Puntos, punto de oro, sets y tie-break explicados
  description: "La puntuación del pádel, explicada de forma sencilla: 15, 30, 40 como en el tenis, punto de oro en lugar de ventaja, orden de saque en dobles, sets, tie-break y los formatos de partido habituales."
  og_title: ¿Cómo se cuenta en el pádel?

breadcrumb: Puntuación en pádel
llms: Cómo se cuenta en el pádel (punto de oro, orden de saque en dobles)
# Article-JSON-LD "about".
about: Pádel

title: Puntuación en pádel
lead: >-
  El pádel se cuenta como el tenis: 15, 30, 40, juego, set. La diferencia es
  el punto de oro: con 40:40, muchos partidos juegan un punto decisivo en
  lugar de la ventaja. A eso se suman el orden de saque en dobles y el saque
  por debajo.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Puntos: 15, 30, 40 como en el tenis"
    text:
      - >-
        Un juego empieza con 0:0 y sigue con 15, 30, 40. Quien está en 40 y
        gana el siguiente punto se lleva el juego, salvo que el rival también
        esté en 40. El tanteo del que saca se canta primero.
  - title: "Con 40:40: ventaja, punto de oro o Star Point"
    text:
      - >-
        Con 40:40, el reglamento de la FIP admite tres métodos: ventaja, punto
        de oro o Star Point.
      - >-
        Con punto de oro, el siguiente punto con 40:40 decide el juego. En
        tenis, la misma regla se llama NoAd. Muchos clubes y ligas juegan con
        punto de oro, así que deja claro el formato antes del partido.
      - >-
        Los circuitos profesionales juegan el Star Point desde 2026. Si se
        llega a iguales por tercera vez, un único punto decisivo cierra el
        juego.
      - >-
        Kortscore cuenta la ventaja y el punto de oro (como NoAd), pero no el
        Star Point.
    demo: golden
    note: >-
      El marcador está en 40:40 con punto de oro. El interruptor cambia a
      ventaja.
  - title: "Dobles: el saque cambia tras cada juego"
    text:
      - >-
        El saque pasa de una pareja a la otra después de cada juego, y dentro
        de cada pareja los compañeros se turnan: quien sacó en el primer juego
        vuelve a sacar en el quinto.
      - >-
        Los lados de resto (derecha y revés) se mantienen durante todo el set
        y solo pueden cambiarse para el set siguiente.
  - title: "Saque: por debajo, dos intentos"
    text:
      - >-
        La bola se bota una vez detrás de la línea de saque y se golpea a la
        altura de la cintura o por debajo, en diagonal hacia el cuadro de
        saque contrario. Si la bola toca la malla metálica después de botar en
        el cuadro, es falta; si toca el cristal, sigue en juego.
  - title: "Sets: 6 juegos, tie-break con 6:6"
    text:
      - >-
        Un set se juega a 6 juegos con dos de diferencia; con 6:6 llega un
        tie-break a 7 puntos con dos de diferencia. El saque cambia tras el
        primer punto y después cada dos puntos.
      - >-
        Un partido se juega normalmente al mejor de tres sets; muchos torneos
        sustituyen el tercer set por un súper tie-break a 10.
  - title: "Cambio de lado: como en el tenis"
    text:
      - >-
        Se cambia de lado tras el primer juego y después cada vez que la suma
        de juegos es impar; en el tie-break, cada seis puntos.
  - title: "Formatos habituales: liga, fase de grupos, Americano"
    text:
      - >-
        Liga: a dos sets ganados, con punto de oro. Fase de grupos de un
        torneo: a menudo un solo set o un set corto a 4 juegos (Kortscore
        juega el tie-break con 3:3). Americano y Mexicano: un número fijo de
        puntos por ronda, normalmente 16, 24 o 32, sin juegos.
      - >-
        Kortscore cuenta individual y dobles, ventaja y NoAd, sets a 4 o 6
        juegos, al mejor de tres sets o un solo set.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Preguntas frecuentes
  questions:
    - q: ¿Quién resta el punto de oro?
      a: >-
        La pareja restadora decide qué jugador resta, pero tiene que mantener
        su reparto de lados habitual: cada jugador resta desde su propio lado.
    - q: ¿El pádel es siempre de dobles?
      a: >-
        Casi siempre. Existe el pádel individual en pistas más estrechas (seis
        metros de ancho en lugar de diez), pero es poco habitual.
    - q: ¿Sirve Kortscore para torneos americanos?
      a: >-
        No como formato propio. Kortscore es para partidos de liga y de torneo
        con sets.

cta:
  title: Contar con Kortscore
  text: >-
    Tocas una vez por punto; la app cuenta juegos, sets y tie-break siguiendo
    exactamente estas reglas.
