meta:
  title: "Relojes compatibles: ¿funciona Kortscore en mi Apple Watch o reloj Wear OS?"
  description: Kortscore funciona en cualquier Apple Watch con watchOS 26 y en cualquier reloj con Wear OS 3 o posterior. Todos los modelos de Apple Watch, Galaxy Watch, Pixel Watch, OnePlus y TicWatch de un vistazo.
  og_title: ¿Funciona Kortscore en mi reloj?

breadcrumb: Relojes compatibles
llms: Relojes compatibles (lista completa de modelos)

eyebrow: Compatibilidad
title: ¿Funciona Kortscore <br>en mi reloj?
lead: >-
  La respuesta corta: sí, en cualquier Apple Watch con watchOS 26 o posterior
  enlazado con un iPhone, y en cualquier reloj con Wear OS 3 o posterior
  enlazado con un móvil con Android 8 o posterior. Eso incluye todos los Apple
  Watch desde el Series 6, el SE a partir de la segunda generación y todos los
  Ultra, todos los Samsung Galaxy Watch desde 2021, todos los Google Pixel
  Watch y los relojes actuales de OnePlus, Mobvoi y Xiaomi. La respuesta larga,
  a continuación.

# Spaltenköpfe und Generationsangaben in den Tabellen.
