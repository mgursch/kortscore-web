# Kompatibilitätsliste. Die Tabellen (Modelle, Jahre, Versionen) stehen in
# templates/compatible.html, hier nur die Texte und Spaltenköpfe.

meta:
  title: "Relojes compatibles: ¿funciona Kortscore en mi Apple Watch o reloj Wear OS?"
  description: Kortscore funciona en cualquier Apple Watch con watchOS 26 y en los relojes Wear OS de la lista, desde el Galaxy Watch 6 y el Pixel Watch 2. Todos los modelos de Apple Watch, Galaxy Watch, Pixel Watch, OnePlus y TicWatch de un vistazo.
  og_title: ¿Funciona Kortscore en mi reloj?

breadcrumb: Relojes compatibles
llms: Relojes compatibles (lista completa de modelos)

title: Relojes compatibles
lead: >-
  Kortscore funciona en cualquier Apple Watch con watchOS 26 o posterior
  enlazado con un iPhone, y en los relojes Wear OS de la lista de abajo
  enlazados con un móvil con Android 8 o posterior. Técnicamente, el reloj
  necesita Wear OS 3 o posterior. Eso incluye todos los Apple Watch desde el
  Series 6, el SE a partir de la segunda generación y todos los Ultra, los
  Samsung Galaxy Watch a partir del Watch 6, los Google Pixel Watch a partir del
  Pixel Watch 2 y los relojes actuales de OnePlus, Mobvoi y Xiaomi. Los
  detalles, a continuación.

# Spaltenköpfe und Generationsangaben in den Tabellen.
col:
  model: Modelo
  year: Año
generation:
  second: 2.ª gen.
  third: 3.ª gen.

version:
  title: Cómo ver la versión del sistema
  body: >-
    <p>En el reloj Wear OS, en <em>Ajustes &gt; Información &gt; Versión de
    software</em>; en Samsung, en <em>Ajustes &gt; Acerca del reloj &gt; Información
    de software</em>. Si aparece Wear OS 3 o superior, la versión del sistema es la adecuada.</p><p><strong>En
    el Apple Watch:</strong> <em>Ajustes &gt; General &gt; Información &gt; Versión</em>.
    Si aparece watchOS 26 o superior, Kortscore funciona. ¿Tienes una versión
    anterior en un modelo de la lista de abajo? Actualízalo primero en
    <em>Ajustes &gt; General &gt; Actualización de software</em>.</p>

apple:
  text: >-
    Kortscore funciona en cualquier Apple Watch con watchOS 26 o posterior, es
    decir, desde el Series 6 de 2020, el SE a partir de la segunda generación y
    todos los Ultra, enlazado con un iPhone con la app Kortscore del App Store.
    En el Apple Watch, el partido se registra como entrenamiento para que la
    pantalla permanezca encendida todo el tiempo.
samsung:
  text: >-
    Kortscore funciona en los Galaxy Watch a partir del Watch 6, también en el
    Ultra y el FE. Todos usan Wear OS. Los Galaxy Watch 3, Active 2 y anteriores
    usan Tizen y no son compatibles.
pixel:
  text: Kortscore funciona en los Pixel Watch a partir del Pixel Watch 2. Usan Wear OS y reciben las actualizaciones directamente de Google, normalmente antes que nadie.
others:
  title: Otras marcas
  text: >-
    No hemos tenido todos estos relojes en la muñeca. Técnicamente, Kortscore
    necesita Wear OS 3 o posterior. Si algo no te funciona, escríbenos a <a
    href="mailto:swordistudios@gmail.com">swordistudios@gmail.com</a>.

unsupported:
  title: Qué no funciona
  list:
    - "<strong>Galaxy Watch 3, Active 2, Active, Gear:</strong> Tizen en lugar de Wear OS."
    - "<strong>Garmin, Fitbit, Polar, Suunto, Coros, Huawei, Amazfit, Xiaomi Smart Band:</strong> sistemas propios, sin Wear OS."
    - "<strong>Wear OS 2:</strong> Fossil Gen 5 y anteriores, Moto 360, TicWatch Pro 3 sin la actualización: demasiado antiguos."
    - "<strong>Apple Watch Series 5, SE (1.ª gen.) y anteriores:</strong> se quedan en watchOS 10 o anterior, y Kortscore necesita watchOS 26."

phone:
  title: El móvil
  text: >-
    La app Kortscore para iPhone necesita iOS 18 o posterior; para enlazarlo
    con un Apple Watch con watchOS 26, Apple exige que el iPhone tenga iOS 26, y iOS 27
    con watchOS 27. Un reloj Wear OS se enlaza con un móvil con Android 8 o posterior. En ambos
    casos, la app Kortscore se descarga del App Store o de Google Play. El
    reloj lleva la cuenta por sí solo; el móvil guarda el historial y las
    estadísticas y envía el marcador en directo a Internet. Las combinaciones
    mixtas no funcionan: un Apple Watch necesita un iPhone, y un reloj Wear OS,
    un móvil Android.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Preguntas
  questions:
    - q: Mi reloj no está en la lista.
      a: >-
        Técnicamente, Kortscore necesita watchOS 26 o Wear OS 3, en ambos casos
        o posterior. Cómo ver tu versión está explicado arriba. Las tablas
        recogen los modelos en los que funciona Kortscore.
    - q: ¿Basta con un reloj LTE sin el móvil?
      a: >-
        Para llevar la cuenta, sí: el reloj no necesita conexión para eso. Para
        el marcador en directo, el móvil tiene que estar dentro del alcance
        Bluetooth, porque es el móvil el que envía el marcador a Internet.
    - q: ¿Cuánta batería gasta un partido?
      a: >-
        Un partido a tres sets consume entre el 15 y el 25 % de la batería,
        según el reloj. Con el reloj cargado del todo aguantas una jornada de
        liga entera.

