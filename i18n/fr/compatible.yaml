# Kompatibilitätsliste. Die Tabellen (Modelle, Jahre, Versionen) stehen in
# templates/compatible.html, hier nur die Texte und Spaltenköpfe.

meta:
  title: "Montres compatibles : Kortscore fonctionne-t-il sur mon Apple Watch ou ma montre Wear OS ?"
  description: Kortscore fonctionne sur toute Apple Watch sous watchOS 26 et sur toute montre sous Wear OS 3 ou plus récent. Tous les modèles Apple Watch, Galaxy Watch, Pixel Watch, OnePlus et TicWatch en un coup d’œil.
  og_title: Kortscore fonctionne-t-il sur ma montre ?

breadcrumb: Montres compatibles
llms: Montres compatibles (liste complète des modèles)

eyebrow: Compatibilité
title: Ma montre est-elle <br>compatible ?
lead: >-
  La réponse courte : oui, sur toute Apple Watch sous watchOS 26 ou plus
  récent jumelée à un iPhone, et sur toute montre sous Wear OS 3 ou plus récent
  associée à un téléphone Android sous Android 8 ou plus récent. Cela couvre
  toutes les Apple Watch depuis la Series 6, la SE à partir de la deuxième
  génération et toutes les Ultra, toutes les Samsung Galaxy Watch depuis 2021,
  toutes les Google Pixel Watch et les montres actuelles de OnePlus, Mobvoi et
  Xiaomi. La réponse détaillée suit.

# Spaltenköpfe und Generationsangaben in den Tabellen.
col:
  model: Modèle
