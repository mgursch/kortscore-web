    réel : depuis le court d’à côté, depuis le club-house ou depuis chez eux.
  points:
    - "Il suffit de partager le lien : les spectateurs n’ont besoin ni d’app ni de compte."
    - Score, déroulé des sets et service en direct, point par point.
  offer: >-
