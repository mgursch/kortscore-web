benefits:
  title: Pourquoi Kortscore
  tap:
    title: Simple comme un tap
    body: >-
      Un tap sur la montre, et le point est compté. Deux pour ton adversaire,
      quatre pour annuler. Pas besoin de regarder l’écran, pas de jeu
      interrompu.
  stats:
    title: Des stats qui comptent
    body: >-
      Taux de victoire, bilan des sets et forme sur tous tes matchs, analysés
      automatiquement. Kortscore Plus ajoute l’historique complet avec le
      déroulé point par point.
  live:
    label: En direct
    title: Le score en direct pour le public
    body: >-
      La famille, les amis et les partenaires de club suivent ton match en
      temps réel sur leur téléphone, point par point, où qu’ils soient.
  free:
    title: Gratuit
    body: >-
      Le comptage, le score en direct et tes 10 derniers matchs ne coûtent
      rien. L’historique complet et l’analyse approfondie, c’est Kortscore
      Plus.

steps:
  title: Comment ça marche
  list:
    - title: Démarre le match
      body: >-
        Choisis un format, ou tape simplement sur ta dernière combinaison.
        Simple, double, NoAd, au meilleur des trois, un seul set : tout est
        possible.
    - title: Joue et tape
      body: >-
        La montre compte les points, les jeux et les sets selon les vraies
        règles du tennis et du padel, tie-break et super tie-break compris.
    - title: Analyse et partage
      body: >-
        Le match arrive automatiquement dans ton historique sur le téléphone,
        avec le score en notation télé, la durée et l’historique des points.

