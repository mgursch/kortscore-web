    Un tap par point, sur le court, sans interrompre le jeu.
  count: ["15", "30", "40", Jeu, Set]
  facts:
    - term: Point en or
      text: >-
        Intégré à l’app sous le nom NoAd. Choisis-le une fois, et le point
        décisif à 40:40 tranche le jeu, exactement comme dans ton championnat.
    - term: Double
