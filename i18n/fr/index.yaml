# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Questions
  questions:
    - q: Ai-je besoin de mon téléphone sur le court ?
      a: >-
        Non. La montre compte entièrement seule, même sans connexion. Seul le
        score en direct a besoin du téléphone à portée Bluetooth, car c’est lui
        qui envoie le score en ligne. Le Wi-Fi ou la 4G (LTE) de la montre ne
        suffisent pas à eux seuls.
    - q: Quelles montres fonctionnent avec Kortscore ?
      a: >-
        Toute Apple Watch sous watchOS 26 ou plus récent, donc Series 6, SE à
        partir de la deuxième génération, Ultra et modèles plus récents,
        jumelée à un iPhone. Et toute montre sous Wear OS 3 ou plus récent,
        donc Samsung Galaxy Watch à partir de la Watch 4, Google Pixel Watch et
        d’autres, associée à un téléphone Android sous Android 8 ou plus récent.
        La liste complète des modèles est sur la
        <a href="{url:compatible}">page de compatibilité</a>.
    - q: Kortscore suit-il les vraies règles, tie-break et NoAd compris ?
      a: >-
        Oui. Avantage ou NoAd, sets en 6 ou en 4 jeux, tie-break et super
        tie-break, au meilleur des trois sets ou en un seul set. Les règles en
        détail : <a href="{url:tennis}">compter au tennis</a>,
        <a href="{url:padel}">compter au padel</a>.
    - q: Comment fonctionne le score en direct ?
      a: >-
        Tu partages un lien depuis l’app. Qui l’ouvre voit le score, le déroulé
        des sets et qui est au service dans le navigateur. Pour cela, ton
        téléphone doit être à portée Bluetooth de la montre.
    - q: Combien coûte Kortscore ?
      a: >-
        Rien. Le comptage, le score en direct et tes 10 derniers matchs sont
        gratuits, sans publicité et sans compte, sur iPhone comme sur Android.
        Kortscore Plus est un achat unique et ajoute l’historique complet des
        matchs avec le déroulé point par point, des statistiques détaillées, des
        sauvegardes automatiques et le Kortscore Trainer (IA), qui analyse tes
        matchs.
    - q: Existe-t-il un Kortscore pour iPhone et Apple Watch ?
      a: >-
        Oui. L’app vient de l’App Store et a une app Apple Watch pour compter,
        avec les mêmes formats et le même code des taps que sur Wear OS. Une
        différence : sur l’Apple Watch, un match est lancé comme un
        entraînement, c’est ce qui garde l’écran allumé pendant le jeu.
    - q: Kortscore fonctionne-t-il sur iPad et Mac ?
      a: >-
        Oui. L’app Kortscore de l’App Store fonctionne aussi sur iPad avec
        iPadOS 18 ou plus récent et sur les Mac avec puce Apple sous macOS 15 ou
        plus récent, dans une fenêtre librement redimensionnable. L’historique
        des matchs, les statistiques et le score en direct y profitent d’un
        plus grand écran. Pour compter au poignet, il faut toujours passer par
        l’iPhone, car Apple ne jumelle l’Apple Watch qu’avec un iPhone.
    - q: Puis-je passer d’Android à l’iPhone en gardant mes matchs ?
      a: >-
        Oui, grâce à la sauvegarde dans l’app : crée une sauvegarde sur l’ancien
        appareil, charge-la sur le nouveau, et c’est fait. Ça marche dans les
        deux sens. Pour l’instant, il n’existe pas de compte Kortscore qui
        synchronise les données via le cloud.

cta:
  title: Pour iPhone et Android
  lede: La montre compte, le téléphone garde l’historique.
  hint: "Configuration requise : iOS et iPadOS 18 ou plus, macOS 15 ou plus (puce Apple), watchOS 26 ou plus, Android 8.0 ou plus, Wear OS 3 ou plus."

