  description: Kortscore compte les points au tennis et au padel d’un simple tap sur ton Apple Watch ou ta montre Wear OS. Gratuit, avec score en direct pour les spectateurs, statistiques et historique des matchs sur iPhone et Android.
  features:
    - Comptage d’un simple tap sur la montre
    - Tennis et padel, simple et double
    - Avantage et NoAd, tie-breaks, sets en 4 ou 6 jeux
