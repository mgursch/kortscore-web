# Der Tippcode als ein Block. Die Zeichen 1× bis 4× stehen in der Vorlage.
tap:
  title: Le code des taps
  lede: >-
    Tu tapes n’importe où sur l’écran, sans regarder. La montre calcule
    elle-même les jeux, les sets et les tie-breaks.
  codes:
    - Point pour toi
    - Point pour l’adversaire
    - Donner le dernier point à l’autre camp
    - Annuler le dernier point
  after: >-
    Simple ou double, avantage ou NoAd, au meilleur des trois sets ou en un
    set : tu choisis avant le premier point. Après la balle de match, le match
    est dans l’historique sur ton téléphone, avec sa durée et le déroulé point
    par point.
  watch_alt: Kortscore sur une Apple Watch à 40-15

clubs:
