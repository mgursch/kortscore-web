# Article-JSON-LD "about".
about: Padel

title: Compter au padel
lead: >-
  Au padel, on compte comme au tennis : 15, 30, 40, jeu, set. La différence,
  c’est le point en or : beaucoup de matchs jouent un point décisif à 40-40 au
  lieu de l’avantage. S’y ajoutent l’ordre de service en double et le service
  par en dessous.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Les points : 15, 30, 40 comme au tennis"
    text:
      - >-
        Un jeu commence à 0-0, puis 15, 30, 40. Celui qui gagne le point
        suivant à 40 remporte le jeu, sauf si l’adversaire est lui aussi à 40.
        Le score du serveur s’annonce en premier.
  - title: "À 40-40 : avantage, point en or ou star point"
    text:
      - >-
        À 40-40, les règles de la FIP autorisent trois méthodes : l’avantage,
        le point en or ou le star point.
      - >-
        Avec le point en or, le point suivant à 40-40 décide du jeu. Au
        tennis, la même règle s’appelle NoAd. Beaucoup de clubs et de
        championnats jouent le point en or, mieux vaut donc fixer le format
        avant le match.
      - >-
        Les circuits professionnels jouent le star point depuis 2026. À la
        troisième égalité, un seul point décisif tranche le jeu.
      - >-
        Kortscore compte l’avantage et le point en or (sous NoAd), mais pas le
        star point.
    demo: golden
    note: >-
      Le tableau est à 40-40 avec point en or. L’interrupteur passe à
      l’avantage.
  - title: "Double : le service change après chaque jeu"
    text:
      - >-
        Le service alterne entre les équipes après chaque jeu, et au sein
        d’une équipe, les partenaires servent à tour de rôle : celui qui a
        servi le premier jeu sert de nouveau au cinquième.
      - >-
        Les côtés de relance (côté droit et côté gauche) restent fixes pendant
        tout un set et ne peuvent être échangés qu’au set suivant.
  - title: "Service : par en dessous, deux essais"
    text:
      - >-
        La balle rebondit une fois derrière la ligne de service et se frappe à
        hauteur de la taille ou plus bas, en diagonale dans le carré de
        service adverse. Si la balle touche le grillage après avoir rebondi
        dans le carré, c’est une faute ; si elle touche la vitre, elle reste
        en jeu.
  - title: "Sets : 6 jeux, tie-break à 6-6"
    text:
      - >-
        Un set se joue en 6 jeux avec deux jeux d’écart ; à 6-6, on joue un
        tie-break en 7 points, avec deux points d’écart. Le service change
        après le premier point, puis tous les deux points.
      - >-
        Un match se joue normalement au meilleur des trois sets ; beaucoup de
        tournois remplacent le troisième set par un super tie-break en 10
        points.
  - title: "Changements de côté : comme au tennis"
    text:
      - >-
        On change de côté après le premier jeu, puis chaque fois que le total
        des jeux est impair, et dans le tie-break tous les six points.
  - title: "Formats courants : championnat, poules, Americano"
    text:
      - >-
        Championnat : deux sets gagnants, point en or. Phase de poules en
        tournoi : souvent un seul set ou un set court en 4 jeux (Kortscore
        joue le tie-break à 3-3). Americano et Mexicano : un nombre fixe de
        points par tour, généralement 16, 24 ou 32, sans jeux.
      - >-
        Kortscore compte le simple et le double, avec avantage ou NoAd, des
        sets en 4 ou 6 jeux, au meilleur des trois ou en un seul set.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Questions fréquentes
  questions:
    - q: Qui relance le point en or ?
      a: >-
        L’équipe en relance choisit lequel des deux partenaires reçoit, mais
        elle doit garder sa répartition habituelle des côtés : chaque joueur
        relance depuis son propre côté.
    - q: Le padel se joue-t-il toujours en double ?
      a: >-
        Presque toujours. Le padel en simple existe sur des courts plus
        étroits (six mètres de large au lieu de dix), mais il reste rare.
    - q: Kortscore compte-t-il les tournois Americano ?
      a: >-
        Pas comme format à part. Kortscore est conçu pour les matchs de
        championnat et de tournoi en sets.

cta:
  title: Compter avec Kortscore
  text: >-
    Tu tapes une fois par point ; l’app compte les jeux, les sets et le
    tie-break selon exactement ces règles.
