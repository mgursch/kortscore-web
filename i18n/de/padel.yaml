# Article-JSON-LD "about".
about: Padel

title: Zählweise im Padel
lead: >-
  Padel zählt wie Tennis: 15, 30, 40, Game, Satz. Der Unterschied ist der
  Golden Point: Viele Matches spielen bei 40:40 einen entscheidenden Punkt
  statt Vorteil. Dazu kommen die Aufschlagreihenfolge im Doppel und der
  Aufschlag von unten.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Punkte: 15, 30, 40 wie im Tennis"
    text:
      - >-
        Ein Game startet bei 0:0, dann 15, 30, 40. Wer bei 40 den nächsten
        Punkt gewinnt, holt das Game, außer der Gegner steht auch bei 40. Der
        Aufschläger wird zuerst genannt.
  - title: "Bei 40:40: Vorteil, Golden Point oder Star Point"
    text:
      - >-
        Bei 40:40 erlaubt das FIP-Regelwerk drei Varianten: Vorteil, Golden
        Point oder Star Point.
      - >-
        Beim Golden Point entscheidet bei 40:40 direkt der nächste Punkt. Im
        Tennis heißt dieselbe Regel NoAd. Viele Vereine und Ligen spielen
        Golden Point, kläre das Format also vor dem Match.
      - >-
        Den Star Point spielen die Profitouren seit 2026. Steht es zum dritten
        Mal Einstand, entscheidet ein einziger Punkt das Game.
      - >-
        Kortscore zählt Vorteil und Golden Point (als NoAd), aber keinen Star
        Point.
    demo: golden
    note: >-
      Die Tafel steht bei 40:40 mit Golden Point. Der Schalter wechselt auf
      Vorteil.
  - title: "Doppel: Aufschlag wechselt nach jedem Game"
    text:
      - >-
        Der Aufschlag wechselt nach jedem Game zwischen den Teams, und
        innerhalb eines Teams schlagen die Partner abwechselnd auf: Wer im
        ersten Game aufgeschlagen hat, ist im fünften wieder dran.
      - >-
        Die Rückschlagseiten (Einstand- und Vorteilseite) bleiben für einen
        Satz fest und dürfen erst zum nächsten Satz getauscht werden.
  - title: "Aufschlag: von unten, zwei Versuche"
    text:
      - >-
        Der Ball wird hinter der Aufschlaglinie einmal aufgeprallt und auf
        Taillenhöhe oder darunter diagonal ins gegnerische Aufschlagfeld
        geschlagen. Berührt der Ball nach dem Aufprall im Feld das Gitter, ist
        es ein Fehler; trifft er die Glaswand, bleibt er im Spiel.
  - title: "Sätze: 6 Games, Tiebreak bei 6:6"
    text:
      - >-
        Ein Satz geht bis 6 Games mit zwei Games Vorsprung, bei 6:6 folgt der
        Tiebreak bis 7 Punkte mit zwei Punkten Vorsprung. Der Aufschlag
        wechselt nach dem ersten Punkt und dann alle zwei Punkte.
      - >-
        Ein Match ist normalerweise Best of 3; viele Turniere ersetzen den
        dritten Satz durch einen Match-Tiebreak bis 10.
  - title: "Seitenwechsel: wie im Tennis"
    text:
      - >-
        Die Seiten werden nach dem ersten Game gewechselt, dann bei jeder
        ungeraden Gamesumme und im Tiebreak alle sechs Punkte.
  - title: "Übliche Formate: Liga, Gruppenphase, Americano"
    text:
      - >-
        Liga: zwei Gewinnsätze mit Golden Point. Turnier-Gruppenphase: oft ein
        Satz oder ein Kurzsatz bis 4 Games (Kortscore spielt den Tiebreak bei
        3:3). Americano und Mexicano: feste Punktzahl pro Runde, meist 16, 24
        oder 32 Punkte, ohne Games.
      - >-
        Kortscore zählt Einzel und Doppel, Vorteil und NoAd, Sätze bis 4 oder
        6, Best of 3 oder einen Satz.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Fragen
  questions:
    - q: Wer nimmt beim Golden Point den Aufschlag an?
      a: >-
        Das rückschlagende Team entscheidet, welcher Partner annimmt, muss aber
        die normale Seitenaufteilung beibehalten: Jeder nimmt von seiner eigenen
        Seite an.
    - q: Spielt man Padel immer im Doppel?
      a: >-
        Fast immer. Einzel-Padel gibt es auf schmaleren Plätzen (sechs statt
        zehn Meter breit), ist aber selten.
    - q: Zählt Kortscore Americano-Turniere?
      a: >-
        Nicht als eigenes Format. Kortscore ist für Liga- und Turniermatches
        mit Sätzen da.

cta:
  title: Zählen mit Kortscore
  text: >-
    Du tippst einmal pro Punkt, die App zählt Games, Sätze und Tiebreak nach
    diesen Regeln mit.
