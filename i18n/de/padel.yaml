  description: "Padel-Zählweise einfach erklärt: 15, 30, 40 wie im Tennis, Golden Point statt Vorteil, Doppel-Aufschlagreihenfolge, Sätze, Tiebreak und die üblichen Matchformate."
  og_title: Wie zählt man beim Padel?

