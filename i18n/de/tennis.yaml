breadcrumb: Tennis-Zählweise
llms: Wie zählt man beim Tennis
# Article-JSON-LD "about".
about: Tennis

title: Zählweise im Tennis
lead: >-
  Die Punkte heißen 15, 30 und 40, ein Game braucht zwei Punkte Vorsprung, ein
  Satz sechs Games, und bei 6:6 kommt der Tiebreak.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Punkte: 0, 15, 30, 40"
    text:
      - >-
        Jedes Game beginnt bei 0:0. Der erste Punkt bringt 15, der zweite 30,
        der dritte 40. Wer bei 40 den nächsten Punkt macht, gewinnt das Game,
        sofern der Gegner nicht auch bei 40 steht.
      - >-
        Der Aufschläger wird immer zuerst genannt: 30:15 heißt, der Aufschläger
        führt.
  - title: "Einstand: nach 40:40 zwei Punkte hintereinander"
    text:
      - >-
        Steht es 40:40, heißt das Einstand („Deuce“). Der nächste Punkt bringt
        den Vorteil, der übernächste das Game. Verliert der Spieler mit Vorteil
        den Punkt, geht es zurück auf Einstand. Ein Game kann so theoretisch
        endlos dauern.
    demo: deuce
    note: >-
      Zähl von Einstand aus Punkte, bis das Game entschieden ist. Der Schalter
      wechselt auf NoAd.
  - title: "NoAd: bei 40:40 entscheidet ein Punkt"
    text:
      - >-
        Viele Ligen, Vereinsturniere und Doppel auf der Profitour spielen NoAd
        („No Advantage“): Bei 40:40 entscheidet der nächste Punkt das Game, der
        Rückschläger wählt die Aufschlagseite. Das hält Matches kürzer und
        planbarer. Im Padel heißt dieselbe Regel Golden Point.
      - >-
        In Kortscore wählst du NoAd beim Start einmal aus, danach zählt die Uhr
        entsprechend.
  - title: "Sätze: sechs Games mit zwei Games Vorsprung"
    text:
      - >-
        Ein Satz geht an den, der zuerst sechs Games hat, mit mindestens zwei
        Games Vorsprung: 6:4 ist ein Satz, 6:5 nicht. Bei 6:5 wird
        weitergespielt, 7:5 gewinnt.
      - >-
        Kurzsätze gehen bis 4 Games. Nach ITF-Regel kommt der Tiebreak bei 4:4,
        erlaubt ist auch 3:3. Kortscore spielt ihn wie FAST4 bei 3:3, ein
        Kurzsatz endet also 4:0, 4:1, 4:2 oder nach Tiebreak bis 7 mit 4:3.
      - >-
        Ein Match ist meist Best of 3, also zwei Gewinnsätze; Grand Slams der
        Herren spielen Best of 5.
  - title: "Tiebreak bei 6:6: bis 7 Punkte"
    text:
      - >-
        Im Tiebreak werden einzelne Punkte gezählt: 1, 2, 3 und so weiter. Wer
        zuerst sieben Punkte hat, mit zwei Punkten Vorsprung, gewinnt Satz und
        Tiebreak, der als 7:6 in die Wertung geht.
      - >-
        Der Aufschlag wechselt nach dem ersten Punkt und danach alle zwei
        Punkte, die Seiten werden alle sechs Punkte gewechselt.
    demo: tiebreak
    note: >-
      Der Tiebreak steht bei 5:4. Zähl weiter, bis der Satz entschieden ist.
  - title: "Champions-Tiebreak: bis 10 Punkte statt dritter Satz"
    text:
      - >-
        Viele Doppel und Hobbyturniere ersetzen den dritten Satz durch einen
        Match-Tiebreak bis 10 Punkte, ebenfalls mit zwei Punkten Vorsprung. In
        der Notation steht dann zum Beispiel 6:3 4:6 [10:7].
      - >-
        Kortscore kennt beide Varianten, Tiebreak bis 7 und Champions-Tiebreak
        bis 10.
  - title: "Aufschlag wechselt jedes Game, Seiten bei ungerader Gamesumme"
    text:
      - >-
        Der Aufschlag wechselt nach jedem Game. Im Einzel schlägt im dritten
        Game wieder auf, wer das erste aufgeschlagen hat. Im Doppel wechseln
        sich die Partner ab, der erste Aufschläger ist also erst im fünften
        Game wieder dran.
      - >-
        Die Seiten werden nach dem ersten, dritten, fünften Game gewechselt,
        also immer wenn die Summe der Games ungerade ist, und nach jedem Satz
        mit gerader Gamezahl erst nach dem ersten Game des nächsten Satzes.
  - title: "Ergebnis notieren: Satz für Satz aus Sicht des Siegers"
    text:
      - >-
        6:4 3:6 7:6(4) heißt drei Sätze, der dritte im Tiebreak mit 7:4
        Punkten.
      - >-
        Kortscore schreibt das Ergebnis genau so in deine Historie, mit Dauer
        und Punkteverlauf.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Fragen
  questions:
    - q: Warum heißen die Punkte 15, 30 und 40?
      a: >-
        Sicher weiß es niemand. Die gängigste Erklärung ist eine Uhr, auf der
        die Viertel 15, 30 und 45 markiert wurden; 45 wurde irgendwann zu 40
        verkürzt, weil es sich schneller ruft. Wichtig ist nur die Reihenfolge.
    - q: Was heißt „Love“?
      a: >-
        Love ist das englische Wort für Null, 0:0 heißt „Love-all“. Vermutlich
        kommt es vom französischen „l'œuf“, das Ei, wegen der Form der Null.
        Ein „Love game“ ist ein Game, in dem der Verlierer keinen Punkt
        gemacht hat.
    - q: Wer schlägt nach dem Tiebreak auf?
      a: >-
        Wer den Tiebreak mit dem ersten Punkt begonnen hat, wird im ersten Game
        des nächsten Satzes Rückschläger. Die Reihenfolge läuft also einfach
        weiter, als wäre der Tiebreak ein Game gewesen.

cta:
  title: Zählen mit Kortscore
  text: >-
    Du tippst einmal pro Punkt; Einstand, Vorteil und den Aufschlagwechsel im
    Tiebreak rechnet die App mit.
