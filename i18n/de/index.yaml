meta:
  title: "Kortscore: Tennis- &amp; Padel-Zähler für Apple Watch &amp; Wear OS"
  description: Tennis und Padel mit einem Tipp auf der Apple Watch oder Wear-OS-Uhr mitzählen. Gratis, mit Live-Ticker für Zuschauer, Statistiken und Matchverlauf.
