# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  eyebrow: FAQ
  title: Häufige Fragen
  lead: Kurze Antworten auf das, was vor dem ersten Match mit Kortscore gefragt wird.
  questions:
    - q: Brauche ich das Handy am Platz?
      a: >-
        Nein. Die Uhr zählt komplett alleine, auch ohne Verbindung. Nur für den
        Live-Ticker muss das Handy in Bluetooth-Reichweite sein, denn es schickt
        den Score ins Netz. WLAN oder LTE auf der Uhr allein reichen dafür nicht.
    - q: Welche Uhren funktionieren mit Kortscore?
      a: >-
        Jede Apple Watch ab watchOS 26, also Series 6, SE ab der zweiten
        Generation, Ultra und neuer, mit einem iPhone. Und jede Uhr mit Wear OS 3
        oder neuer, also Samsung Galaxy Watch ab der Watch 4, Google Pixel Watch
        und andere, mit einem Android-Handy ab Android 8. Vier Empfehlungen für
        den Platz findest du auf der <a href="{url:watches}">Uhrenseite</a>, die
        ganze Modellliste auf der <a href="{url:compatible}">Kompatibilitätsseite</a>.
    - q: Wie zähle ich einen Punkt?
      a: >-
        Einmal auf die Uhr tippen: Punkt für dich. Zweimal: Punkt für den
        Gegner. Viermal: letzten Punkt zurücknehmen. Games, Sätze und Tiebreaks
        rechnet die Uhr selbst, du musst nicht aufs Display schauen. Wer es
        einmal in Ruhe durchgehen will: In der App gibt es am Handy und auf der
        Uhr eine Anleitung mit allen Tipps zum Nachtippen.
    - q: Zählt Kortscore nach echten Regeln, auch mit Tiebreak und NoAd?
      a: >-
        Ja. Vorteil oder NoAd, Sätze bis 6 oder bis 4, Tiebreak und
        Champions-Tiebreak, Best of 3 oder ein Satz. Beim Padel wählst du Golden
        Point einfach als NoAd, dann entscheidet der Punkt bei 40:40 das Game.
        Die Regeln im Detail: <a href="{url:tennis}">Zählweise Tennis</a>,
        <a href="{url:padel}">Zählweise Padel</a>.
    - q: Wie funktioniert der Live-Ticker?
      a: >-
        Du teilst einen Link, mehr nicht. Wer ihn öffnet, sieht Punktestand,
        Satzverlauf und Aufschlag live im Browser, Punkt für Punkt. Zuschauer
        brauchen keine App und kein Konto, egal ob sie am Nebenplatz stehen oder
        zu Hause sitzen. Das Handy muss dafür in Bluetooth-Reichweite der Uhr
        sein.
    - q: Was kostet Kortscore?
      a: >-
        Nichts. Zählen, Live-Ticker und die neuesten 10 Matches deiner Historie
        sind gratis, ohne Werbung und ohne Konto, auf iPhone und Android
        gleich. Kortscore Plus ist ein einmaliger Kauf und bringt die komplette
        Match-Historie mit Punkteverlauf, erweiterte Statistiken, automatische
        Backups und den KI-Trainer, der deine Matches analysiert.
    - q: Kann ich Kortscore auch für Padel verwenden?
      a: >-
        Ja, ohne Umwege. Padel zählt wie Tennis, und Doppel ist eines der
        Formate direkt am Startbildschirm. Einzel, Doppel, NoAd: einmal
        auswählen, dann zählt die Uhr mit.
    - q: Gibt es Kortscore für iPhone und Apple Watch?
      a: >-
        Ja. Dasselbe Kortscore, gebaut für iPhone und Apple Watch: ein Tap pro
        Punkt am Handgelenk, Live-Ticker, Match-Historie am Handy. Gratis im App
        Store, Kortscore Plus gibt es dort ebenfalls als einmaligen Kauf.
    - q: Läuft Kortscore auch auf iPad und Mac?
      a: >-
        Ja. Die Kortscore-App aus dem App Store läuft auch auf dem iPad ab
        iPadOS 18 und auf Macs mit Apple-Chip ab macOS 15, in einem frei
        skalierbaren Fenster. Match-Historie, Statistiken und Live-Ticker
        bekommen dort einen größeren Bildschirm. Gezählt wird am Handgelenk
        weiterhin übers iPhone, weil Apple die Apple Watch nur mit einem iPhone
        koppelt.
    - q: Läuft die Apple-Watch-Version genauso wie unter Wear OS?
      a: >-
        Ja, gezählt wird auf beiden gleich: ein Tap pro Punkt, dieselben
        Formate, derselbe Live-Ticker. Ein Unterschied: Auf der Apple Watch
        läuft ein Match als Sportaktivität. Nur so bleibt das Display während
        des Spiels dauerhaft an.
    - q: Kann ich von Android auf iPhone wechseln und meine Matches mitnehmen?
      a: >-
        Ja, über Backup und Wiederherstellen in der App: am alten Gerät ein
        Backup erstellen, am neuen einspielen, fertig. Das geht in beide
        Richtungen. Ein Kortscore-Konto, das die Daten über die Cloud abgleicht,
        gibt es derzeit nicht.

