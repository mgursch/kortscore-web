# Zeile in llms.txt.
llms: Startseite (Deutsch)

hero:
  eyebrow: Tennis und Padel
  title: Ein Tap pro Punkt
  lede: >-
    Kortscore zählt dein Tennis- oder Padelmatch am Handgelenk mit, Punkt für
    Punkt, ohne dass du aufs Display schauen musst.
  cta: App laden →
  platforms: Für Apple Watch und Wear OS, mit iPhone oder Android-Handy
  alt:
    play: Kortscore Startbildschirm mit den Match-Formaten
    live: Ein laufendes Match in Kortscore mit dem Live-Punktestand
    stats: Kortscore Statistik mit Siegquote und Satzbilanz
    watch: Kortscore auf einer Smartwatch mit dem aktuellen Punktestand

benefits:
  title: Funktionen
  tap:
    title: Der Tap-Code
    body: >-
      Einmal tippen: Punkt für dich. Zweimal: Punkt für den Gegner. Viermal:
      letzten Punkt zurücknehmen. Die Uhr rechnet Games, Sätze und Tiebreaks
      selbst.
  stats:
    title: Statistik
    body: >-
      Siegquote, Satzbilanz und Form über alle deine Matches, automatisch
      ausgewertet.
  live:
    label: Live
    title: Live-Ticker
    body: >-
      Ein geteilter Link zeigt Zuschauern den Stand im Browser, Punkt für
      Punkt.
  free:
    title: Gratis
    body: >-
      Zählen, Live-Ticker und die neuesten 10 Matches der Historie kosten
      nichts. Kortscore Plus ist ein einmaliger Kauf und schaltet die
      komplette Historie mit Punkteverlauf frei.

steps:
  title: Ablauf
  list:
    - title: Match starten
      body: >-
        Format wählen oder die letzte Kombination antippen. Einzel, Doppel,
        NoAd, Best of 3, ein Satz.
    - title: Zählen
      body: >-
        Die Uhr zählt Punkte, Games und Sätze nach den Tennis- und
        Padelregeln, inklusive Tiebreak und Champions-Tiebreak.
    - title: Historie
      body: >-
        Das Match landet automatisch in der Historie am Handy, mit Score in
        Broadcast-Notation, Dauer und Punkteverlauf.

padel:
  eyebrow: Padel
  title: Padel mit Golden Point
  lead: >-
    Padel zählt wie Tennis: 15, 30, 40, Game, Satz. Kortscore braucht dafür
    keinen eigenen Modus, die Uhr zählt einfach mit.
    <a href="{url:padel}">So zählt man beim Padel</a>
  count: ["15", "30", "40", Game, Satz]
  facts:
    - term: Golden Point
      text: >-
        Als NoAd in die App integriert. Einmal auswählen, dann entscheidet
        der Punkt bei 40:40 das Game.
    - term: Doppel
      text: >-
        Padel läuft fast immer im Doppel. In Kortscore ist Doppel eines der
        Formate auf dem Startbildschirm.
    - term: Nicht dabei
      text: >-
        Star Point und Americano zählt Kortscore nicht. Die App ist für Liga-
        und Turniermatches mit Sätzen gemacht.

