# Zeile in llms.txt.
llms: Startseite (Deutsch)

hero:
  title: Ein Tap pro Punkt
  lede: >-
    Kortscore zählt dein Tennis- oder Padelmatch am Handgelenk mit, Punkt für
    Punkt, ohne dass du aufs Display schauen musst.
  cta: App laden →
  platforms: Gratis für Apple Watch und Wear OS, mit iPhone oder Android-Handy.
  watch_alt: Kortscore auf einer Wear-OS-Uhr mit dem aktuellen Punktestand

# Der Tippcode als ein Block. Die Zeichen 1× bis 4× stehen in der Vorlage.
tap:
  title: Der Tap-Code
  lede: >-
    Getippt wird irgendwo aufs Display, ohne hinzusehen. Spiele, Sätze und
    Tiebreaks rechnet die Uhr selbst.
  codes:
    - Punkt für dich
    - Punkt für den Gegner
    - Letzten Punkt dem anderen geben
    - Letzten Punkt zurücknehmen
  after: >-
    Einzel oder Doppel, Vorteil oder NoAd, Best of 3 oder ein Satz wählst du
    vor dem ersten Punkt. Nach dem Matchball liegt das Match mit Dauer und
    Punkteverlauf in der Historie am Handy.
  watch_alt: Kortscore auf einer Apple Watch beim Stand 40:15

clubs:
  title: Live-Ticker für den Verein
  lead: >-
    Bei Meisterschaftsspielen laufen mehrere Matches gleichzeitig, und keiner
    kann überall sein. Mit dem Live-Ticker sehen Mannschaft, Kapitän und Fans
    jedes Match in Echtzeit: vom Nebenplatz, aus der Kantine oder von zu
    Hause.
  points:
    - Ein geteilter Link genügt, Zuschauer brauchen keine App und kein Konto.
    - Punktestand, Satzverlauf und Aufschlag live, Punkt für Punkt.
  offer: >-
    Hängt unseren Flyer im Verein auf, dann bekommen eure Mitglieder
    Kortscore Plus günstiger.
  offer_link: Das Vereinsangebot
  # Beispiel einer Ticker-Ansicht, keine echten Daten.
  ticker:
    label: Meisterschaft, Runde 4
    home: Heim
    away: Gast
    live: Live
    done: Beendet
    serve: Aufschlag
    matches:
      - Einzel 1, Platz 1
      - Einzel 2, Platz 2
      - Doppel 1, Platz 3

padel:
  title: Padel mit Golden Point
  lead: >-
    Padel zählt wie Tennis: 15, 30, 40, Spiel, Satz. Golden Point ist in
    Kortscore ein Schalter: an, und bei 40:40 entscheidet der nächste Punkt.
  link: So zählt man beim Padel

watches:
  title: Uhren für den Platz
  lede: Noch keine Uhr? Diese vier halten ein langes Match durch und sind in der Sonne ablesbar.
  all: Die vier Uhren im Detail
  compatible: Alle kompatiblen Modelle
  notes:
    apple: Fürs iPhone
    galaxy: Wear OS 6
    ultra: Große Batterie
    pixel: Kompakt

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Fragen
  questions:
    - q: Brauche ich das Handy am Platz?
      a: >-
        Nein. Die Uhr zählt komplett alleine, auch ohne Verbindung. Nur für den
        Live-Ticker muss das Handy in Bluetooth-Reichweite sein, denn es schickt
        den Score ins Netz. WLAN oder LTE auf der Uhr allein reichen dafür nicht.
    - q: Welche Uhren funktionieren mit Kortscore?
      a: >-
        Jede Apple Watch ab watchOS 26, also Series 6, SE ab der zweiten
        Generation, Ultra und neuer, mit einem iPhone. Und jede Uhr mit Wear OS 3
        oder neuer, also Samsung Galaxy Watch ab der Watch 4, Google Pixel Watch
        und andere, mit einem Android-Handy ab Android 8. Die ganze Modellliste
        steht auf der <a href="{url:compatible}">Kompatibilitätsseite</a>.
    - q: Zählt Kortscore nach echten Regeln, auch mit Tiebreak und NoAd?
      a: >-
        Ja. Vorteil oder NoAd, Sätze bis 6 oder bis 4, Tiebreak und
        Champions-Tiebreak, Best of 3 oder ein Satz. Die Regeln im Detail:
        <a href="{url:tennis}">Zählweise Tennis</a>,
        <a href="{url:padel}">Zählweise Padel</a>.
    - q: Wie funktioniert der Live-Ticker?
      a: >-
        Du teilst aus der App einen Link. Wer ihn öffnet, sieht Punktestand,
        Satzverlauf und Aufschlag im Browser. Das Handy muss dafür in
        Bluetooth-Reichweite der Uhr sein.
    - q: Was kostet Kortscore?
      a: >-
        Nichts. Zählen, Live-Ticker und die neuesten 10 Matches deiner Historie
        sind gratis, ohne Werbung und ohne Konto, auf iPhone und Android
        gleich. Kortscore Plus ist ein einmaliger Kauf und bringt die komplette
        Match-Historie mit Punkteverlauf, erweiterte Statistiken, automatische
        Backups und den KI-Trainer, der deine Matches analysiert.
    - q: Gibt es Kortscore für iPhone und Apple Watch?
      a: >-
        Ja. Die App kommt aus dem App Store und hat eine Apple-Watch-App zum
        Zählen, mit denselben Formaten und demselben Tap-Code wie unter Wear OS.
        Ein Unterschied: Auf der Apple Watch läuft ein Match als
        Sportaktivität, nur so bleibt das Display während des Spiels an.
    - q: Läuft Kortscore auch auf iPad und Mac?
      a: >-
        Ja. Die Kortscore-App aus dem App Store läuft auch auf dem iPad ab
        iPadOS 18 und auf Macs mit Apple-Chip ab macOS 15, in einem frei
        skalierbaren Fenster. Match-Historie, Statistiken und Live-Ticker
        bekommen dort einen größeren Bildschirm. Gezählt wird am Handgelenk
        weiterhin übers iPhone, weil Apple die Apple Watch nur mit einem iPhone
        koppelt.
    - q: Kann ich von Android auf iPhone wechseln und meine Matches mitnehmen?
      a: >-
        Ja, über Backup und Wiederherstellen in der App: am alten Gerät ein
        Backup erstellen, am neuen einspielen, fertig. Das geht in beide
        Richtungen. Ein Kortscore-Konto, das die Daten über die Cloud abgleicht,
        gibt es derzeit nicht.

cta:
  title: Für iPhone und Android
  lede: Die Uhr zählt, das Handy speichert die Historie.
  hint: "Voraussetzungen: iOS und iPadOS ab 18, macOS ab 15 (Apple-Chip), watchOS ab 26, Android ab 8.0, Wear OS ab 3."

# JSON-LD SoftwareApplication (nur im Quelltext, nicht sichtbar).
app:
  alternate_name: "Kortscore: Tennis &amp; Padel"
  description: Kortscore zählt Tennis- und Padelmatches mit einem Tipp auf der Apple Watch oder Wear-OS-Uhr mit. Gratis, mit Live-Ticker für Zuschauer, Statistiken und Matchverlauf auf iPhone und Android.
  features:
    - Zählen mit einem Tipp auf der Uhr
