  eyebrow: Vereine
  title: Live-Ticker für den Verein
  lead: >-
    Bei Meisterschaftsspielen laufen mehrere Matches gleichzeitig, und keiner
    kann überall sein. Mit dem Live-Ticker sehen Mannschaft, Kapitän und Fans
