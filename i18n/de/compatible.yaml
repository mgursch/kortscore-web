# Kompatibilitätsliste. Die Tabellen (Modelle, Jahre, Versionen) stehen in
# templates/compatible.html, hier nur die Texte und Spaltenköpfe.

meta:
  title: "Kompatible Uhren: Läuft Kortscore auf meiner Apple Watch oder Wear-OS-Uhr?"
  description: Kortscore läuft auf jeder Apple Watch ab watchOS 26 und auf den Wear-OS-Uhren aus der Liste, etwa ab Galaxy Watch 6 und Pixel Watch 2. Alle Apple-Watch-, Galaxy-Watch-, Pixel-Watch-, OnePlus- und TicWatch-Modelle im Überblick.
  og_title: Läuft Kortscore auf meiner Uhr?

breadcrumb: Kompatible Uhren
llms: Kompatible Uhren

title: Kompatible Uhren
lead: >-
  Kortscore läuft auf jeder Apple Watch ab watchOS 26 mit einem iPhone und auf
  den Wear-OS-Uhren aus der Liste unten mit einem Android-Handy ab Android 8.
  Technisch braucht die Uhr Wear OS 3 oder neuer. Das sind alle Apple Watches ab
  der Series 6, die SE ab der zweiten Generation und jede Ultra, die Samsung
  Galaxy Watch ab der Watch 6, die Google Pixel Watch ab der Pixel Watch 2 und
  die aktuellen Uhren von OnePlus, Mobvoi und Xiaomi. Die Details stehen unten.

# Spaltenköpfe und Generationsangaben in den Tabellen.
col:
  model: Modell
  year: Jahr
generation:
  second: 2. Gen.
  third: 3. Gen.

version:
  title: So findest du deine Systemversion
  body: >-
    <p>Auf der Wear-OS-Uhr unter <em>Einstellungen &gt; Info &gt; Softwareversion</em>,
    bei Samsung unter <em>Einstellungen &gt; Info zur Uhr &gt; Softwareinformationen</em>.
    Steht dort Wear OS 3 oder höher, passt die Systemversion.</p><p><strong>Auf der
    Apple Watch:</strong> <em>Einstellungen &gt; Allgemein &gt; Info &gt; Version</em>.
    Steht dort watchOS 26 oder höher, läuft Kortscore. Ältere Version auf einem
    Modell aus der Liste unten? Dann zuerst unter <em>Einstellungen &gt; Allgemein &gt;
    Softwareupdate</em> aktualisieren.</p>

apple:
  text: >-
    Kortscore läuft auf jeder Apple Watch mit watchOS 26 oder neuer, also ab der
    Series 6 aus dem Jahr 2020, die SE ab der zweiten Generation und jede Ultra.
    Dazu gehört ein iPhone mit der Kortscore-App aus dem App Store. Auf der Apple
    Watch läuft ein Match als Sportaktivität, damit das Display die ganze Zeit
    an bleibt.
samsung:
  text: >-
    Kortscore läuft auf den Galaxy Watches ab der Watch 6, auch auf Ultra und
    FE. Sie laufen alle mit Wear OS. Galaxy Watch 3, Active 2 und älter laufen
    mit Tizen und sind nicht kompatibel.
pixel:
  text: Kortscore läuft auf den Pixel Watches ab der Pixel Watch 2. Sie laufen mit Wear OS und bekommen Updates direkt von Google, meist als erste.
others:
  title: Weitere Hersteller
  text: >-
    Diese Uhren haben wir nicht alle selbst in der Hand gehabt. Technisch
    braucht Kortscore Wear OS 3 oder neuer. Wenn bei dir etwas nicht
    funktioniert, schreib uns an <a
    href="mailto:swordistudios@gmail.com">swordistudios@gmail.com</a>.

unsupported:
  title: Was nicht geht
  list:
    - "<strong>Galaxy Watch 3, Active 2, Active, Gear:</strong> Tizen statt Wear OS."
    - "<strong>Garmin, Fitbit, Polar, Suunto, Coros, Huawei, Amazfit, Xiaomi Smart Band:</strong> eigene Systeme ohne Wear OS."
    - "<strong>Wear OS 2:</strong> Fossil Gen 5 und älter, Moto 360, TicWatch Pro 3 ohne Update: zu alt."
    - "<strong>Apple Watch Series 5, SE (1. Gen.) und älter:</strong> enden bei watchOS 10 oder früher, Kortscore braucht watchOS 26."

phone:
  title: Das Handy
  text: >-
    Die Kortscore-App fürs iPhone braucht iOS 18 oder neuer; mit einer Apple
    Watch auf watchOS 26 verlangt Apple fürs Koppeln ein iPhone mit iOS 26, mit
    watchOS 27 eines mit iOS 27. Zur
    Wear-OS-Uhr gehört ein Android-Handy ab Android 8. Die Kortscore-App kommt
    jeweils aus dem App Store bzw. Play Store. Die Uhr zählt alleine, das Handy
    hält Historie und Statistik und schickt den Live-Ticker ins Netz. Gemischte
    Paare gehen nicht: Eine Apple Watch braucht ein iPhone, eine Wear-OS-Uhr ein
    Android-Handy.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Fragen
  questions:
    - q: Meine Uhr steht nicht in der Liste.
      a: >-
        Technisch braucht Kortscore watchOS 26 oder Wear OS 3, jeweils oder
        neuer. Wie du deine Version findest, steht oben. Die Tabellen nennen die
        Modelle, auf denen Kortscore läuft.
    - q: Reicht eine LTE-Uhr ohne Handy?
      a: >-
        Zum Zählen ja, die Uhr braucht dafür keine Verbindung. Für den
        Live-Ticker muss das Handy in Bluetooth-Reichweite sein, denn es schickt
        den Score ins Netz.
    - q: Wie viel Akku braucht ein Match?
      a: >-
        Ein Drei-Satz-Match kostet je nach Uhr 15 bis 25 Prozent Akku. Mit einer
        vollen Uhr kommst du also durch einen ganzen Meisterschaftstag.

