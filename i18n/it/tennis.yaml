meta:
  title: Come si conta nel tennis? Punti, game, set e tie-break spiegati
  description: "Il punteggio del tennis spiegato in modo semplice: 15, 30, 40, parità e vantaggio, NoAd, game e set, tie-break e super tie-break, turni di servizio e cambi di campo."
  og_title: Come si conta nel tennis?

breadcrumb: Punteggio nel tennis
llms: Come si conta nel tennis (le regole spiegate)
# Article-JSON-LD "about".
about: Tennis

title: Punteggio nel tennis
lead: >-
  I punti si chiamano 15, 30 e 40, per vincere un game servono due punti di
  scarto, per un set sei game, e sul 6:6 si gioca il tie-break.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Punti: 0, 15, 30, 40"
    text:
      - >-
        Ogni game parte da 0:0. Il primo punto vale 15, il secondo 30, il
        terzo 40. Chi è a 40 e vince il punto successivo si aggiudica il game,
        a meno che anche l’avversario non sia a 40.
      - >-
        Il punteggio di chi serve si dice sempre per primo: 30:15 significa
        che è avanti chi serve.
  - title: "Parità: dopo il 40:40 due punti di fila"
    text:
      - >-
        Sul 40:40 c’è parità. Il primo punto dà il vantaggio, il secondo il
        game. Se chi ha il vantaggio perde il punto, si torna in parità. In
        teoria un game può durare all’infinito.
    demo: deuce
    note: >-
      Conta i punti partendo dalla parità, finché il game è deciso.
      L’interruttore passa a NoAd.
  - title: "NoAd: sul 40:40 decide un punto"
    text:
      - >-
        Molti campionati, tornei di circolo e il doppio professionistico si
        giocano NoAd, abbreviazione di «no advantage»: sul 40:40 il punto
        successivo decide il game, e chi risponde sceglie da quale lato
        ricevere. Così le partite restano più brevi e più prevedibili. Nel
        padel la stessa regola si chiama punto d’oro.
      - >-
        In Kortscore scegli NoAd una volta all’inizio e l’orologio conta di
        conseguenza.
  - title: "Set: sei game con due game di scarto"
    text:
      - >-
        Il set va a chi vince per primo sei game con almeno due game di
        scarto: 6:4 chiude il set, 6:5 no. Sul 6:5 si continua, e il 7:5 vale
        il set.
      - >-
        I set brevi si giocano a 4 game. La regola ITF prevede il tie-break
        sul 4:4 e ammette in alternativa il 3:3. Kortscore lo gioca sul 3:3,
        come nel FAST4: un set breve finisce quindi 4:0, 4:1, 4:2 o, dopo un
        tie-break a 7, 4:3.
      - >-
        Di solito una partita si gioca al meglio dei tre set; nei tornei
        maschili del Grande Slam si gioca al meglio dei cinque.
  - title: "Tie-break sul 6:6: il primo a 7 punti"
    text:
      - >-
        Nel tie-break i punti si contano uno per uno: 1, 2, 3 e così via. Chi
        arriva per primo a sette punti, con due punti di scarto, vince il
        tie-break e il set, che si registra come 7:6.
      - >-
        Il servizio cambia dopo il primo punto e poi ogni due punti; si cambia
        campo ogni sei punti.
    demo: tiebreak
    note: >-
      Il tie-break è sul 5:4. Continua a contare finché il set è deciso.
  - title: "Super tie-break a 10 punti al posto del terzo set"
    text:
      - >-
        Molti tornei di doppio e di circolo sostituiscono il terzo set con un
        tie-break decisivo a 10 punti, sempre con due punti di scarto. Il
        risultato si scrive allora, per esempio, 6-3 4-6 [10-7].
      - >-
        Kortscore li conosce entrambi: tie-break a 7 e super tie-break a 10.
  - title: "Il servizio cambia a ogni game, il campo dopo una somma dispari di game"
    text:
      - >-
        Il servizio passa all’avversario dopo ogni game. Nel singolare chi ha
        servito nel primo game serve di nuovo nel terzo. Nel doppio i compagni
        si alternano, quindi chi ha servito per primo torna a servire nel
        quinto game.
      - >-
        Si cambia campo dopo il primo, il terzo e il quinto game, cioè ogni
        volta che la somma dei game è dispari; dopo un set chiuso con un
        numero pari di game, solo dopo il primo game del set successivo.
  - title: "Scrivere il risultato: set per set, dal punto di vista di chi ha vinto"
    text:
      - >-
        6-4 3-6 7-6(4) significa tre set, il terzo deciso da un tie-break
        vinto per 7 punti a 4.
      - >-
        Kortscore registra il risultato esattamente così nella tua cronologia,
        con la durata e il registro punto per punto.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Domande frequenti
  questions:
    - q: Perché i punti si chiamano 15, 30 e 40?
      a: >-
        Nessuno lo sa con certezza. La spiegazione più diffusa è un quadrante
        d’orologio diviso in quarti, 15, 30 e 45, con il 45 accorciato in 40
        perché si pronuncia più in fretta. Conta solo l’ordine.
    - q: Cosa significa «love»?
      a: >-
        «Love» è la parola inglese per zero, e 0:0 si dice «love-all».
        Probabilmente deriva dal francese «l’œuf», l’uovo, per la forma dello
        zero. Un «love game» è un game a zero, in cui chi perde non ha fatto
        nemmeno un punto.
    - q: Chi serve dopo il tie-break?
      a: >-
        Chi ha servito il primo punto del tie-break risponde nel primo game
        del set successivo. La rotazione prosegue semplicemente come se il
        tie-break fosse stato un game.

cta:
  title: Contare con Kortscore
  text: >-
    Tocchi una volta per punto; parità, vantaggio e turni di servizio nel
    tie-break li calcola l’app secondo esattamente queste regole.
