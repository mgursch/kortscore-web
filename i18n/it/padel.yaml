  title: "Contapunti e regole del padel: punto d’oro, Star Point, set a 4 game e super tie-break"
  description: "Conta i punti di padel con un tocco sull’Apple Watch o sull’orologio Wear OS: punto d’oro, Star Point o vantaggi, set a 6 o a 4 game, super tie-break e statistiche per compagno. Con il punteggio del padel spiegato in modo semplice."
  og_title: "Kortscore per il padel: il punteggio al polso"

breadcrumb: "Punteggio nel padel"
llms: "Padel: contapunti e regole (punto d’oro, Star Point, set brevi)"
# Article-JSON-LD "about".
about: Padel

# Kopf: h1, Satz, Hinweis zur Tafel; app_name ist der alternateName im JSON-LD.
hero:
  title: "Il punteggio del padel al polso"
  lead: >-
    Kortscore conta la tua partita di padel con un tocco per punto
    sull’Apple Watch o sull’orologio Wear OS. Punto d’oro, Star Point o
    vantaggi, set a 6 o a 4 game, super tie-break: imposta l’app come si
    gioca nel tuo campionato.
  board_note: >-
    Provalo con la regola dello Star Point: conquista il vantaggio e perdilo
    due volte, il punto successivo è lo Star Point. Scegli la regola sotto il tabellone.
  app_name: "Kortscore: contapunti per padel"

# Funktionen der App für Padel, nur Produktbeschreibung (keine Termine).
features:
  title: "Cosa fa Kortscore per il padel"
  blocks:
    - title: "Punteggio con un tocco sull’orologio"
      text: >-
        Un tocco per il tuo punto, due per quello dell’avversario, tre
        invertono l’ultimo punto, quattro lo annullano. Nell’onboarding
        scegli tra Tennis e Padel e l’app si adatta; l’orologio riprende lo
        sport dal telefono. In Kortscore il padel si gioca solo in doppio.
    - title: "Punto d’oro, Star Point o vantaggi"
      text: >-
        Sul 40-40 scegli la regola del tuo campionato. Punto d’oro: un solo
        punto decisivo. Star Point, la regola FIP dal 2026: si giocano due
        vantaggi e, se si perdono entrambi, un unico Star Point decide il game
        (non nei tie-break). Durante lo Star Point l’orologio mostra
        l’avviso «★ Star Point». Oppure i vantaggi classici.
    - title: "Set a 6 o a 4 game"
      text: >-
        Gioca 6 game per set oppure set brevi a 4 game con tie-break sul 3-3
        o sul 4-4. Con il tie-break sul 4-4 un set richiede due game di
        scarto (per esempio 5-3); sul 4-4 un tie-break decide per 5-4.
    - title: "Set completo o super tie-break"
      text: >-
        Per il set decisivo scegli tra un set completo e un super tie-break
        a 10.
    - title: "Statistiche per compagno"
      text: >-
        Le statistiche sono separate per ogni sport. Il padel aggiunge le
        statistiche per compagno (la tua percentuale di vittorie con
        ciascuno) e il bilancio contro le coppie.

# Die Regeln: Überschrift, Einleitung, dann ein Abschnitt je Regel. Mit demo
# (Name der Tafel, siehe templates/partials/rules.html) und note steht darunter
# ein Scoreboard zum Ausprobieren.
title: "Punteggio nel padel"
lead: >-
  Il padel si conta come il tennis: 15, 30, 40, game, set. La differenza sta
  sul 40-40: molte partite giocano un punto decisivo invece dei vantaggi. Si
  aggiungono l’ordine di servizio nel doppio e il servizio dal basso.
sections:
  - title: "Punti: 15, 30, 40 come nel tennis"
    text:
      - >-
        Un game parte da 0-0, poi 15, 30, 40. Chi è a 40 e vince il punto
        successivo si aggiudica il game, a meno che anche l’avversario non
        sia a 40. Il punteggio di chi serve si dice per primo.
  - title: "Sul 40-40: vantaggi, punto d’oro o Star Point"
    text:
      - >-
        Sul 40-40 il regolamento FIP ammette tre metodi: i vantaggi, il
        punto d’oro o lo Star Point.
      - >-
        Con il punto d’oro il punto successivo sul 40-40 decide il game. Nel
        tennis la stessa regola si chiama NoAd. Molti circoli e campionati
        giocano con il punto d’oro, quindi meglio chiarire il formato prima
        della partita.
      - >-
        Lo Star Point è la regola FIP dal 2026. Sul 40-40 si giocano due
        vantaggi. Se si perdono entrambi, cioè se si torna sul 40-40 per la
        terza volta, un unico Star Point decide il game. Nel tie-break non
        c’è lo Star Point.
      - >-
        Kortscore conta tutti e tre: i vantaggi, il punto d’oro e lo Star
        Point.
    demo: golden
    note: >-
      Il tabellone è sul 40-40. Passa tra vantaggi, punto d’oro e Star
      Point. Per lo Star Point, conquista il vantaggio e perdilo due volte.
  - title: "Doppio: il servizio cambia dopo ogni game"
    text:
      - >-
        Il servizio passa da una coppia all’altra dopo ogni game, e
        all’interno della coppia i compagni si alternano: chi ha servito nel
        primo game serve di nuovo nel quinto.
      - >-
        I lati di risposta (destro e sinistro) restano fissi per tutto il
        set e si possono scambiare solo al set successivo.
  - title: "Servizio: dal basso, due tentativi"
    text:
      - >-
        La palla si fa rimbalzare una volta dietro la linea di servizio e si
        colpisce all’altezza della vita o più in basso, in diagonale nel
        riquadro di servizio avversario. Se dopo il rimbalzo nel riquadro la
        palla tocca la rete metallica è fallo; se colpisce il vetro resta in
        gioco.
  - title: "Set: a 6 game o set brevi a 4"
    text:
      - >-
        Un set si gioca a 6 game con due game di scarto; sul 6-6 segue un
        tie-break a 7 punti con due punti di scarto. Il servizio cambia dopo
        il primo punto e poi ogni due punti.
      - >-
        I set brevi si giocano a 4 game. Il tie-break si gioca sul 3-3 o sul
        4-4, a seconda del formato. Con il tie-break sul 4-4 un set richiede
        due game di scarto (per esempio 5-3); sul 4-4 un tie-break decide
        per 5-4.
      - >-
        Di norma una partita si gioca al meglio dei tre set; molti tornei
        sostituiscono il terzo set con un super tie-break a 10.
  - title: "Cambio di campo: come nel tennis"
    text:
      - >-
        Si cambia campo dopo il primo game, poi ogni volta che la somma dei
        game è dispari e nel tie-break ogni sei punti.
  - title: "Formati comuni: campionato e gironi"
    text:
      - >-
        Campionato: due set vinti, di solito con punto d’oro. Fase a gironi
        dei tornei: spesso un set unico o un set breve a 4 game.
      - >-
        Kortscore conta il padel in doppio con vantaggi, punto d’oro o Star
        Point, set a 6 o a 4 game, al meglio dei tre set con set decisivo
        completo o super tie-break a 10.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: "Domande frequenti"
  questions:
    - q: "Cos’è lo Star Point nel padel?"
      a: >-
        Lo Star Point è la regola FIP dal 2026. Sul 40-40 si giocano due
        vantaggi. Se si perdono entrambi, un unico Star Point decide il game.
        Non vale nel tie-break. Kortscore lo conta, e durante quel punto
        l’orologio mostra l’avviso «★ Star Point».
    - q: "Come funziona un set a 4 game con tie-break sul 4-4?"
      a: >-
        Il set si gioca a 4 game. Con il tie-break sul 4-4 un set richiede
        due game di scarto, per esempio 5-3. Se si arriva al 4-4, un
        tie-break decide il set per 5-4. In alternativa puoi giocare il
        tie-break già sul 3-3.
    - q: "Chi riceve sul punto d’oro?"
      a: >-
        La coppia in risposta decide quale dei due giocatori riceve, ma deve
        mantenere la normale divisione dei lati: ognuno riceve dal proprio
        lato.
    - q: "Il padel si gioca sempre in doppio?"
      a: >-
        Quasi sempre. Il padel in singolare esiste, su campi più stretti
        (sei metri di larghezza invece di dieci), ma è raro. In Kortscore il
        padel si gioca solo in doppio.
    - q: "Kortscore conta i tornei Americano?"
      a: >-
        Non come formato a sé. Kortscore è fatto per le partite di
        campionato e di torneo con i set.

cta:
  title: "Contare con Kortscore"
  text: >-
    Tocchi una volta per punto; l’app conta game, set e tie-break secondo
    esattamente queste regole.
