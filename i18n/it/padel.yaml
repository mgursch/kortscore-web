# Article-JSON-LD "about".
about: Padel

title: Punteggio nel padel
lead: >-
  Il padel si conta come il tennis: 15, 30, 40, game, set. La differenza è il
  punto d’oro: sul 40:40 molte partite giocano un punto decisivo invece dei
  vantaggi. Si aggiungono l’ordine di servizio nel doppio e il servizio dal
  basso.

# Jeder Abschnitt: title und text (Liste von Absätzen). Mit demo (Name der
# Tafel, siehe templates/partials/rules.html) und note steht darunter ein
# Scoreboard zum Ausprobieren.
sections:
  - title: "Punti: 15, 30, 40 come nel tennis"
    text:
      - >-
        Un game parte da 0:0, poi 15, 30, 40. Chi è a 40 e vince il punto
        successivo si aggiudica il game, a meno che anche l’avversario non sia
        a 40. Il punteggio di chi serve si dice per primo.
  - title: "Sul 40:40: vantaggi, punto d’oro o star point"
    text:
      - >-
        Sul 40:40 il regolamento FIP ammette tre metodi: i vantaggi, il punto
        d’oro o lo star point.
      - >-
        Con il punto d’oro il punto successivo sul 40:40 decide il game. Nel
        tennis la stessa regola si chiama NoAd. Molti circoli e campionati
        giocano con il punto d’oro, quindi meglio chiarire il formato prima
        della partita.
      - >-
        I circuiti professionistici giocano lo star point dal 2026. Alla terza
        parità, un solo punto decisivo chiude il game.
      - >-
        Kortscore conta i vantaggi e il punto d’oro (come NoAd), non lo star
        point.
    demo: golden
    note: >-
      Il tabellone è sul 40:40 con punto d’oro. L’interruttore passa ai
      vantaggi.
  - title: "Doppio: il servizio cambia dopo ogni game"
    text:
      - >-
        Il servizio passa da una coppia all’altra dopo ogni game, e
        all’interno della coppia i compagni si alternano: chi ha servito nel
        primo game serve di nuovo nel quinto.
      - >-
        I lati di risposta (destro e sinistro) restano fissi per tutto il set
        e si possono scambiare solo al set successivo.
  - title: "Servizio: dal basso, due tentativi"
    text:
      - >-
        La palla si fa rimbalzare una volta dietro la linea di servizio e si
        colpisce all’altezza della vita o più in basso, in diagonale nel
        riquadro di servizio avversario. Se dopo il rimbalzo nel riquadro la
        palla tocca la rete metallica è fallo; se colpisce il vetro resta in
        gioco.
  - title: "Set: 6 game, tie-break sul 6:6"
    text:
      - >-
        Un set si gioca a 6 game con due game di scarto; sul 6:6 segue un
        tie-break a 7 punti con due punti di scarto. Il servizio cambia dopo
        il primo punto e poi ogni due punti.
      - >-
        Di norma una partita si gioca al meglio dei tre set; molti tornei
        sostituiscono il terzo set con un super tie-break a 10.
  - title: "Cambio di campo: come nel tennis"
    text:
      - >-
        Si cambia campo dopo il primo game, poi ogni volta che la somma dei
        game è dispari e nel tie-break ogni sei punti.
  - title: "Formati comuni: campionato, gironi, Americano"
    text:
      - >-
        Campionato: due set vinti, punto d’oro. Fase a gironi dei tornei:
        spesso un set unico o un set breve a 4 game (Kortscore gioca il
        tie-break sul 3:3). Americano e Mexicano: un numero fisso di punti per
        turno, di solito 16, 24 o 32, senza game.
      - >-
        Kortscore conta singolare e doppio, vantaggio e NoAd, set a 4 o a 6,
        al meglio dei tre set o set unico.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Domande frequenti
  questions:
    - q: Chi riceve sul punto d’oro?
      a: >-
        La coppia in risposta decide quale dei due giocatori riceve, ma deve
        mantenere la normale divisione dei lati: ognuno riceve dal proprio
        lato.
    - q: Il padel si gioca sempre in doppio?
      a: >-
        Quasi sempre. Il padel in singolare esiste, su campi più stretti (sei
        metri di larghezza invece di dieci), ma è raro.
    - q: Kortscore conta i tornei Americano?
      a: >-
        Non come formato a sé. Kortscore è fatto per le partite di campionato
        e di torneo con i set.

cta:
  title: Contare con Kortscore
  text: >-
    Tocchi una volta per punto; l’app conta game, set e tie-break secondo
    esattamente queste regole.
