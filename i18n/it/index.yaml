steps:
  title: Come funziona
  list:
    - title: Inizia la partita
      body: >-
        Scegli un formato o tocca semplicemente l’ultima combinazione.
        Singolare, doppio, NoAd, al meglio dei tre set, set unico: si può fare
        tutto.
    - title: Gioca e tocca
      body: >-
        L’orologio conta punti, game e set secondo le vere regole del tennis e
        del padel, tie-break e super tie-break compresi.
    - title: Analizza e condividi
      body: >-
        La partita finisce in automatico nella tua cronologia sul telefono, con
        il punteggio in notazione televisiva, la durata e il registro dei punti.

padel:
  eyebrow: Anche per il padel
  title: Padel? Si conta uguale.
  lead: >-
    Il padel si conta come il tennis: 15, 30, 40, game, set. Per questo
    Kortscore non ha bisogno di trattamenti speciali, l’orologio conta e basta.
    Un tocco per punto, in campo, senza interrompere il gioco.
  count: ["15", "30", "40", Game, Set]
  facts:
    - term: Punto d’oro
      text: >-
        Integrato nell’app come NoAd. Lo scegli una volta e sul 40:40 è il
        punto decisivo a chiudere il game, proprio come si gioca nel tuo
        campionato.
    - term: Doppio
      text: >-
        Il padel si gioca quasi sempre in doppio, e anche in Kortscore il
        doppio non è un caso speciale: è uno dei formati nella schermata
        iniziale.
    - term: Live per chi guarda
      text: >-
        Condividi il link e chi è fuori dal campo segue ogni punto, dal campo
        accanto o da casa.

