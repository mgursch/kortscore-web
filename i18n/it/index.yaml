# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  eyebrow: FAQ
  title: Domande frequenti
  lead: Risposte brevi alle domande più comuni prima di iniziare con Kortscore.
  questions:
    - q: Mi serve il telefono in campo?
      a: >-
        No. L’orologio conta il punteggio in piena autonomia, anche senza
        connessione. Solo il punteggio live richiede il telefono nel raggio
        Bluetooth, perché è il telefono a inviare il punteggio online. Il Wi-Fi
        o l’LTE dell’orologio da soli non bastano.
    - q: Quali orologi funzionano con Kortscore?
      a: >-
        Ogni Apple Watch con watchOS 26 o successivo, quindi Series 6, SE dalla
        seconda generazione, Ultra e modelli più recenti, abbinato a un iPhone.
        E ogni orologio con Wear OS 3 o successivo, quindi Samsung Galaxy Watch
        dal Watch 4 in poi, Google Pixel Watch e altri, abbinato a un telefono
        Android con Android 8 o successivo. Quattro proposte per il campo sono
        nella <a href="{url:watches}">pagina degli orologi</a>, l’elenco completo
        dei modelli nella <a href="{url:compatible}">pagina sulla
        compatibilità</a>.
    - q: Come conto un punto?
      a: >-
        Tocca l’orologio una volta: punto per te. Due volte: punto per
        l’avversario. Quattro volte: annulli l’ultimo punto. Game, set e
        tie-break li calcola l’orologio, non devi mai guardare il display. Se
        vuoi provare tutto con calma: nell’app trovi una guida sia sul telefono
        sia sull’orologio, dove puoi esercitarti con ogni gesto.
    - q: Kortscore segue le vere regole, tie-break e NoAd compresi?
      a: >-
        Sì. Vantaggio o NoAd, set a 6 o a 4 game, tie-break e super tie-break,
        al meglio dei tre set o set unico. Nel padel scegli il punto d’oro come
        NoAd e sul 40:40 è un solo punto a decidere il game. Le regole nel
        dettaglio: <a href="{url:tennis}">punteggio nel tennis</a>, <a
        href="{url:padel}">punteggio nel padel</a>.
    - q: Come funziona il punteggio live?
      a: >-
        Condividi un link, tutto qui. Chi lo apre vede il punteggio, l’andamento
        dei set e chi serve, live nel browser, punto per punto. Gli spettatori
        non hanno bisogno né di app né di account, che siano al campo accanto o
        a casa. Perché funzioni, il telefono deve essere nel raggio Bluetooth
        dell’orologio.
    - q: Quanto costa Kortscore?
      a: >-
        Niente. Conteggio, cronologia partite e punteggio live sono gratis,
        senza pubblicità e senza account, su iPhone come su Android. Kortscore
        Plus è un acquisto unico e aggiunge statistiche dettagliate, backup
        automatici e il Kortscore Trainer (IA), che analizza le tue partite.
    - q: Posso usare Kortscore per il padel?
      a: >-
        Sì, senza complicazioni. Il padel si conta come il tennis, e il doppio è
        uno dei formati direttamente nella schermata iniziale. Singolare,
        doppio, NoAd: scegli una volta e l’orologio conta per te.
    - q: Esiste Kortscore per iPhone e Apple Watch?
      a: >-
        Sì. Lo stesso Kortscore, pensato per iPhone e Apple Watch: un tocco al
        polso per ogni punto, il punteggio live, la cronologia partite sul
        telefono. Gratis su App Store, e anche lì Kortscore Plus è un acquisto
        unico.
    - q: Kortscore funziona su iPad e Mac?
      a: >-
        Sì. L’app Kortscore di App Store funziona anche su iPad con iPadOS 18 o
        successivo e sui Mac con chip Apple e macOS 15 o successivo, in una
        finestra ridimensionabile a piacere. Lì cronologia partite, statistiche
        e punteggio live hanno uno schermo più grande. Per contare al polso
        serve comunque l’iPhone, perché Apple abbina l’Apple Watch solo a un
        iPhone.
    - q: La versione per Apple Watch funziona come quella per Wear OS?
      a: >-
        Sì, il conteggio è identico: un tocco per punto, gli stessi formati, lo
        stesso punteggio live. Una differenza: sull’Apple Watch la partita viene
        avviata come allenamento. È così che lo schermo resta acceso per
        tutta la partita.
    - q: Posso passare da Android a iPhone e portare con me le mie partite?
      a: >-
        Sì, con il backup dell’app: crei un backup sul vecchio dispositivo, lo
        carichi sul nuovo, fatto. Funziona in entrambe le direzioni. Al momento
        non esiste un account Kortscore che sincronizzi i dati tramite cloud.

