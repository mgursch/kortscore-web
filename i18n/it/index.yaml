hero:
  title: La tua partita. <br>I tuoi punti. <br><em>Un tocco.</em>
  lede: >-
    Kortscore conta la tua partita di tennis o padel al polso, punto per punto,
    senza interrompere il gioco. E chi non è in campo la segue live.
  cta: Scarica l’app →
  platforms: Gratis per Apple Watch e Wear OS, con iPhone o telefono Android.
  watch_alt: Kortscore su un orologio Wear OS con il punteggio attuale

# Der Tippcode als ein Block. Die Zeichen 1× bis 4× stehen in der Vorlage.
tap:
  title: Il codice dei tocchi
  lede: >-
    Tocchi un punto qualsiasi del display, senza guardare. Game, set e
    tie-break li calcola l’orologio.
  codes:
    - Punto per te
    - Punto per l’avversario
    - Dai l’ultimo punto all’altra parte
    - Annulla l’ultimo punto
  after: >-
    Singolare o doppio, vantaggio o NoAd, al meglio dei tre set o set unico:
    scegli prima del primo punto. Dopo il match point la partita è nella
    cronologia sul telefono, con durata e registro punto per punto.
  watch_alt: Kortscore su un Apple Watch sul 40-15

clubs:
  title: Tutto il circolo <br>segue live
  lead: >-
    In una giornata di campionato si giocano più partite in contemporanea, e
    nessuno può essere ovunque. Con il punteggio live squadra, capitano e tifosi
    seguono ogni partita in tempo reale: dal campo accanto, dalla club house o
    da casa.
  points:
    - "Basta condividere il link: gli spettatori non hanno bisogno né di app né di account."
    - Punteggio, andamento dei set e servizio live, punto per punto.
  offer: >-
    Appendete il nostro volantino nel vostro circolo e i vostri soci avranno
    Kortscore Plus a un prezzo più conveniente.
  offer_link: L’offerta per i circoli
  # Beispiel einer Ticker-Ansicht, keine echten Daten.
  ticker:
    label: Campionato, giornata 4
    home: Casa
    away: Ospiti
    live: Live
    done: Finita
    serve: Al servizio
    matches:
      - Singolare 1, campo 1
      - Singolare 2, campo 2
      - Doppio 1, campo 3

padel:
  title: Padel con punto d’oro
  lead: >-
    Il padel si conta come il tennis: 15, 30, 40, game, set. In Kortscore il
    punto d’oro è un interruttore: acceso, sul 40-40 decide il punto
    successivo.
  link: Come si conta nel padel

