# Kompatibilitätsliste. Die Tabellen (Modelle, Jahre, Versionen) stehen in
# templates/compatible.html, hier nur die Texte und Spaltenköpfe.

meta:
  title: "Orologi compatibili: Kortscore funziona sul mio Apple Watch o orologio Wear OS?"
  description: Kortscore funziona su ogni Apple Watch con watchOS 26 e sugli orologi Wear OS dell’elenco, dal Galaxy Watch 6 e dal Pixel Watch 2 in poi. Tutti i modelli di Apple Watch, Galaxy Watch, Pixel Watch, OnePlus e TicWatch a colpo d’occhio.
  og_title: Kortscore funziona sul mio orologio?

breadcrumb: Orologi compatibili
llms: Orologi compatibili (elenco completo dei modelli)

title: Orologi compatibili
lead: >-
  Kortscore funziona su ogni Apple Watch con watchOS 26 o successivo abbinato a
  un iPhone, e sugli orologi Wear OS dell’elenco qui sotto abbinati a un
  telefono Android con Android 8 o successivo. Tecnicamente l’orologio richiede
  Wear OS 3 o successivo. Quindi su ogni Apple Watch a partire da Series 6,
  sull’Apple Watch SE dalla seconda generazione e su ogni Apple Watch Ultra, sui
  Samsung Galaxy Watch dal Watch 6 in poi, sui Google Pixel Watch dal Pixel
  Watch 2 in poi e sugli attuali orologi di OnePlus, Mobvoi e Xiaomi. I dettagli
  sono qui sotto.

# Spaltenköpfe und Generationsangaben in den Tabellen.
col:
  model: Modello
  year: Anno
generation:
  second: 2ª gen.
  third: 3ª gen.

version:
  title: Come trovare la versione del sistema
  body: >-
    <p>Sull’orologio Wear OS in <em>Impostazioni &gt; Info &gt; Versione software</em>,
    sui Samsung in <em>Impostazioni &gt; Info sull’orologio &gt; Informazioni
    software</em>. Se c’è scritto Wear OS 3 o successivo, la versione del sistema va bene.</p><p><strong>Sull’Apple Watch:</strong> <em>Impostazioni &gt;
    Generali &gt; Info &gt; Versione</em>. Se c’è scritto watchOS 26 o successivo,
    Kortscore funziona. Versione più vecchia su un modello dell’elenco qui
    sotto? Aggiornalo prima in <em>Impostazioni &gt; Generali &gt; Aggiornamento
    software</em>.</p>

apple:
  text: >-
    Kortscore funziona su ogni Apple Watch con watchOS 26 o successivo, quindi
    dall’Apple Watch Series 6 del 2020 in poi, sull’Apple Watch SE dalla seconda
    generazione e su ogni Apple Watch Ultra, abbinato a un iPhone con l’app
    Kortscore di App Store. Sull’Apple Watch la partita viene avviata come
    allenamento, così lo schermo resta acceso per tutto il tempo.
samsung:
  text: >-
    Kortscore funziona sui Galaxy Watch dal Watch 6 in poi, anche su Ultra e FE.
    Tutti usano Wear OS. Galaxy Watch 3, Active 2 e modelli precedenti usano
    Tizen e non sono compatibili.
pixel:
  text: Kortscore funziona sui Pixel Watch dal Pixel Watch 2 in poi. Usano Wear OS e ricevono gli aggiornamenti direttamente da Google, di solito per primi.
others:
  title: Altre marche
  text: >-
    Non li abbiamo provati tutti al polso. Tecnicamente Kortscore richiede Wear
    OS 3 o successivo. Se qualcosa non va, scrivici a <a
    href="mailto:swordistudios@gmail.com">swordistudios@gmail.com</a>.

unsupported:
  title: Cosa non funziona
  list:
    - "<strong>Galaxy Watch 3, Active 2, Active, Gear:</strong> Tizen invece di Wear OS."
    - "<strong>Garmin, Fitbit, Polar, Suunto, Coros, Huawei, Amazfit, Xiaomi Smart Band:</strong> sistemi propri, niente Wear OS."
    - "<strong>Wear OS 2:</strong> Fossil Gen 5 e precedenti, Moto 360, TicWatch Pro 3 senza aggiornamento: troppo vecchi."
    - "<strong>Apple Watch Series 5, SE (1ª gen.) e precedenti:</strong> si fermano a watchOS 10 o prima, Kortscore richiede watchOS 26."

phone:
  title: Il telefono
  text: >-
    L’app Kortscore per iPhone richiede iOS 18 o successivo; con un Apple Watch
    su watchOS 26, Apple richiede che l’iPhone abbia iOS 26, e iOS 27 con
    watchOS 27. Un orologio Wear OS
    si abbina a un telefono Android con Android 8 o successivo. In entrambi i
    casi l’app Kortscore si scarica da App Store o da Google Play. L’orologio
    conta da solo; il telefono conserva cronologia e statistiche e invia online
    il punteggio live. Le coppie miste non funzionano: un Apple Watch ha bisogno
    di un iPhone, un orologio Wear OS di un telefono Android.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Domande
  questions:
    - q: Il mio orologio non è nell’elenco.
      a: >-
        Tecnicamente Kortscore richiede watchOS 26 o Wear OS 3, in entrambi i
        casi o successivo. Come trovare la versione è spiegato sopra. Le tabelle
        elencano i modelli su cui Kortscore funziona.
    - q: Basta un orologio LTE senza telefono?
      a: >-
        Per contare i punti sì, l’orologio non ha bisogno di alcuna connessione.
        Per il punteggio live il telefono deve essere nel raggio Bluetooth,
        perché è il telefono a inviare il punteggio online.
    - q: Quanta batteria consuma una partita?
      a: >-
        Una partita di tre set consuma dal 15 al 25 per cento della batteria, a
        seconda dell’orologio. Con l’orologio carico arrivi in fondo a
        un’intera giornata di campionato.

