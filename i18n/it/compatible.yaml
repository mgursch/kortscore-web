# Kompatibilitätsliste. Die Tabellen (Modelle, Jahre, Versionen) stehen in
# templates/compatible.html, hier nur die Texte und Spaltenköpfe.

meta:
  title: "Orologi compatibili: Kortscore funziona sul mio Apple Watch o orologio Wear OS?"
  description: Kortscore funziona su ogni Apple Watch con watchOS 26 e su ogni orologio con Wear OS 3 o successivo. Tutti i modelli di Apple Watch, Galaxy Watch, Pixel Watch, OnePlus e TicWatch a colpo d’occhio.
  og_title: Kortscore funziona sul mio orologio?

breadcrumb: Orologi compatibili
llms: Orologi compatibili (elenco completo dei modelli)

eyebrow: Compatibilità
title: Kortscore funziona <br>sul mio orologio?
lead: >-
  La risposta breve: sì, su ogni Apple Watch con watchOS 26 o successivo
  abbinato a un iPhone, e su ogni orologio con Wear OS 3 o successivo abbinato a
  un telefono Android con Android 8 o successivo. Quindi su ogni Apple Watch
  a partire da Series 6, sull’Apple Watch SE dalla seconda generazione e su ogni
  Apple Watch Ultra, su ogni Samsung Galaxy Watch dal 2021, su ogni Google Pixel
  Watch e sugli attuali orologi di OnePlus, Mobvoi e Xiaomi. La risposta lunga è
  qui sotto.

# Spaltenköpfe und Generationsangaben in den Tabellen.
col:
  model: Modello
