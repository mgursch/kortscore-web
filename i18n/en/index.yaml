# Der Tippcode als ein Block. Die Zeichen 1× bis 4× stehen in der Vorlage.
tap:
  title: The tap code
  lede: >-
    Tap anywhere on the display, without looking. The watch works out games,
    sets and tiebreaks itself.
  codes:
    - Point for you
    - Point for your opponent
    - Give the last point to the other side
    - Undo the last point
  after: >-
    Singles or doubles, advantage or NoAd, best of 3 or one set: you choose
    before the first point. After match point, the match sits in the history
    on your phone with its duration and point-by-point log.
  watch_alt: Kortscore on an Apple Watch at 40-15

