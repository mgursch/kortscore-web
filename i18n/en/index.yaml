meta:
  title: "Kortscore: Tennis &amp; Padel Scorekeeper for Apple Watch &amp; Wear OS"
  description: Score tennis and padel matches with one tap on your Apple Watch or Wear OS watch. Free, with a live score ticker for spectators, stats and match history.
  og_title: "Kortscore: One tap per point"

