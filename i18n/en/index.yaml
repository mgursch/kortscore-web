  title: How it works
  list:
    - title: Start the match
      body: >-
        Pick a format or tap the last combination. Singles, doubles, NoAd,
        best of 3, a single set.
    - title: Keep score
      body: >-
        The watch counts points, games and sets by the tennis and padel rules,
