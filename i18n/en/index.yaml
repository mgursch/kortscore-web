# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Questions
  questions:
    - q: Do I need my phone on court?
      a: >-
        No. The watch keeps score entirely on its own, even without a
        connection. Only the live ticker needs the phone within Bluetooth range,
        because the phone is what sends the score online. Wi-Fi or LTE on the
        watch alone is not enough for that.
    - q: Which watches work with Kortscore?
      a: >-
        Any Apple Watch on watchOS 26 or newer, so Series 6, SE from the second
        generation, Ultra and later, paired with an iPhone. And any watch running
        Wear OS 3 or newer, so Samsung Galaxy Watch from the Watch 4 on, Google
        Pixel Watch and others, paired with an Android phone on Android 8 or
        newer. The full model list is on the <a href="{url:compatible}">compatibility
        page</a>.
    - q: Does Kortscore follow the real rules, including tiebreaks and NoAd?
      a: >-
        Yes. Advantage or NoAd, sets to 6 or to 4, tiebreak and champions
        tiebreak, best of 3 or a single set. The rules in detail:
        <a href="{url:tennis}">tennis scoring</a>, <a href="{url:padel}">padel
        scoring</a>.
    - q: How does the live ticker work?
      a: >-
        You share a link from the app. Whoever opens it sees the score, the set
        history and who is serving in the browser. Your phone has to be within
        Bluetooth range of the watch for this.
    - q: How much does Kortscore cost?
      a: >-
        Nothing. Scoring, the live ticker and your newest 10 matches are free,
        with no ads and no account, the same on iPhone and Android. Kortscore
        Plus is a one-time purchase and adds the complete match history with the
        point-by-point log, advanced statistics, automatic backups and the AI
        coach that analyses your matches.
    - q: Is there a Kortscore for iPhone and Apple Watch?
      a: >-
        Yes. The app comes from the App Store and has an Apple Watch app for
        scoring, with the same formats and the same tap code as on Wear OS. One
        difference: on the Apple Watch a match runs as a workout, which is what
        keeps the display on during play.
    - q: Does Kortscore run on iPad and Mac?
      a: >-
        Yes. The Kortscore app from the App Store also runs on iPad with iPadOS
        18 or newer and on Macs with Apple silicon and macOS 15 or newer, in a
        freely resizable window. Match history, statistics and the live ticker
        get a bigger screen there. Scoring on the wrist still goes through the
        iPhone, because Apple pairs the Apple Watch only with an iPhone.
    - q: Can I switch from Android to iPhone and bring my matches along?
      a: >-
        Yes, through backup and restore in the app: create a backup on the old
        device, restore it on the new one, done. It works in both directions.
        There is currently no Kortscore account that syncs data through the
        cloud.

cta:
  title: For iPhone and Android
  lede: The watch keeps score, the phone keeps the history.
  hint: "Requirements: iOS and iPadOS 18 or newer, macOS 15 or newer (Apple silicon), watchOS 26 or newer, Android 8.0 or newer, Wear OS 3 or newer."

