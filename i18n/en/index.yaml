padel:
  eyebrow: Padel
  title: Padel with golden point
  lead: >-
    Padel scores like tennis: 15, 30, 40, game, set. Kortscore needs no mode of
    its own for it, the watch simply counts along.
    <a href="{url:padel}">How padel scoring works</a>
  count: ["15", "30", "40", Game, Set]
  facts:
    - term: Golden Point
      text: >-
        Built into the app as NoAd. Pick it once and the deciding point at
        40-40 settles the game.
    - term: Doubles
      text: >-
        Padel is nearly always doubles. In Kortscore, doubles is one of the
        formats on the start screen.
    - term: Not included
      text: >-
        Kortscore does not count star point or Americano. The app is made for
        league and tournament matches with sets.

