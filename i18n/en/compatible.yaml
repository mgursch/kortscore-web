meta:
  title: "Compatible Watches: Does Kortscore Run on My Apple Watch or Wear OS Watch?"
  description: Kortscore runs on every Apple Watch with watchOS 26 and any watch with Wear OS 3 or newer. Every Apple Watch, Galaxy Watch, Pixel Watch, OnePlus and TicWatch model at a glance.
  og_title: Does Kortscore run on my watch?

breadcrumb: Compatible watches
llms: Compatible watches (full model list)

eyebrow: Compatibility
title: Does Kortscore run <br>on my watch?
lead: >-
  The short answer: yes, on every Apple Watch on watchOS 26 or newer paired
  with an iPhone, and on every watch running Wear OS 3 or newer paired with an
  Android phone on Android 8 or newer. That covers every Apple Watch since the
  Series 6, the SE from the second generation and every Ultra, every Samsung
  Galaxy Watch since 2021, every Google Pixel Watch and the current watches from
  OnePlus, Mobvoi and Xiaomi. The long answer is below.

# Spaltenköpfe und Generationsangaben in den Tabellen.
