meta:
  title: How Does Tennis Scoring Work? Points, Games, Sets and Tiebreaks Explained
  description: "Tennis scoring made simple: 15, 30, 40, deuce and advantage, NoAd, games and sets, tiebreak and champions tiebreak, serve rotation and changing ends."
  og_title: How does tennis scoring work?

breadcrumb: Tennis scoring
llms: How tennis scoring works (rules explainer)
# Article-JSON-LD "about".
about: Tennis

title: Tennis scoring
lead: >-
  Points are called 15, 30 and 40, a game needs a two-point margin, a set needs
  six games, and at 6-6 there is a tiebreak.

# Every section: title and text (a list of paragraphs). With demo (name of the
# board, see templates/partials/rules.html) and note, a scoreboard to try out
# follows below.
sections:
  - title: "Points: 0, 15, 30, 40"
    text:
      - >-
        Every game starts at 0-0. The first point is worth 15, the second 30,
        the third 40. Whoever wins the next point at 40 wins the game, unless
        the opponent is also at 40.
      - >-
        The server's score is always called first: 30-15 means the server
        leads.
  - title: "Deuce: two points in a row after 40-40"
    text:
      - >-
        At 40-40 the score is deuce. The next point gives the advantage, the
        one after that the game. If the player with the advantage loses the
        point, it is back to deuce. In theory a game can go on forever.
    demo: deuce
    note: >-
      Count points from deuce until the game is decided. The switch changes to
      NoAd.
  - title: "NoAd: at 40-40 one point decides"
    text:
      - >-
        Many leagues, club tournaments and pro doubles play NoAd, short for no
        advantage: at 40-40 the next point decides the game, and the receiver
        chooses which side to receive on. It keeps matches shorter and more
        predictable. In padel the same rule is called golden point.
      - >-
        In Kortscore you pick NoAd once at the start and the watch counts
        accordingly.
  - title: "Sets: six games with a margin of two"
    text:
      - >-
        A set goes to the first player with six games and a margin of at least
        two: 6-4 wins a set, 6-5 does not. At 6-5 play continues, 7-5 wins.
      - >-
        Short sets go to 4 games. The ITF rule plays the tiebreak at 4-4 and
        allows 3-3 as an alternative. Kortscore plays it at 3-3, as in FAST4,
        so a short set ends 4-0, 4-1, 4-2 or, after a tiebreak to 7, 4-3.
      - >-
        A match is usually best of three sets; men's Grand Slams play best of
        five.
  - title: "Tiebreak at 6-6: first to 7 points"
    text:
      - >-
        In a tiebreak points are counted one by one: 1, 2, 3 and so on. The
        first to seven points, with a two-point margin, wins the tiebreak and
        the set, recorded as 7-6.
      - >-
        Serve changes after the first point and then every two points; players
        change ends every six points.
    demo: tiebreak
    note: >-
      The tiebreak stands at 5-4. Keep counting until the set is decided.
  - title: "Champions tiebreak: to 10 points instead of a third set"
    text:
      - >-
        Many doubles and club events replace the third set with a match
        tiebreak to 10 points, again with a two-point margin. The score then
        reads, for instance, 6-3 4-6 [10-7].
      - >-
        Kortscore knows both: tiebreak to 7 and champions tiebreak to 10.
  - title: "Serve changes every game, ends after odd game totals"
    text:
      - >-
        Serve alternates after every game. In singles, whoever served the first
        game serves the third again. In doubles the partners take turns, so the
        first server serves again in the fifth game.
      - >-
        Players change ends after the first, third, fifth game, so whenever the
        total number of games is odd, and after a set with an even number of
        games only after the first game of the next set.
  - title: "Writing down the score: set by set, winner first"
    text:
      - >-
        6-4 3-6 7-6(4) means three sets, the third decided in a tiebreak won
        7-4.
      - >-
        Kortscore writes the result into your history exactly like that, with
        duration and the point-by-point log.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Questions
  questions:
    - q: Why are the points called 15, 30 and 40?
      a: >-
        Nobody knows for sure. The most common explanation is a clock face
        marked at the quarters, 15, 30 and 45, with 45 shortened to 40 because
        it is quicker to call. Only the order matters.
    - q: What does love mean?
      a: >-
        Love is the English word for zero, and 0-0 is called love-all. It
        probably comes from the French l'œuf, the egg, for the shape of the
        zero. A love game is a game in which the loser did not win a single
        point.
    - q: Who serves after the tiebreak?
      a: >-
        Whoever served the first point of the tiebreak receives in the first
        game of the next set. The rotation simply carries on as if the tiebreak
        had been one game.

cta:
  title: Count with Kortscore
  text: >-
    You tap once per point; the app works out deuce, advantage and the serve
    rotation in the tiebreak by exactly these rules.
