meta:
  title: How Does Padel Scoring Work? Points, Golden Point, Sets and Tiebreaks Explained
  description: "Padel scoring made simple: 15, 30, 40 like tennis, golden point instead of advantage, doubles serve order, sets, tiebreak and the usual match formats."
  og_title: How does padel scoring work?

breadcrumb: Padel scoring
llms: How padel scoring works (golden point, doubles serve order)
# Article-JSON-LD "about".
about: Padel

title: Padel scoring
lead: >-
  Padel scores like tennis: 15, 30, 40, game, set. The difference is the golden
  point: many matches play one deciding point at 40-40 instead of advantage.
  Add the doubles serve order and the underarm serve.

# Every section: title and text (a list of paragraphs). With demo (name of the
# board, see templates/partials/rules.html) and note, a scoreboard to try out
# follows below.
sections:
  - title: "Points: 15, 30, 40 like tennis"
    text:
      - >-
        A game starts at 0-0, then 15, 30, 40. Whoever wins the next point at 40
        takes the game, unless the opponent is also at 40. The server's score
        is called first.
  - title: "At 40-40: advantage, golden point or star point"
    text:
      - >-
        At 40-40 the FIP rules allow three methods: advantage, golden point or
        star point.
      - >-
        With golden point the next point at 40-40 decides the game. In tennis
        the same rule is called NoAd. Many clubs and leagues play golden point,
        so settle the format before the match.
      - >-
        The pro tours have played the star point since 2026. If the game goes
        back to deuce a third time, one deciding point settles it.
      - >-
        Kortscore counts advantage and golden point (as NoAd), not the star
        point.
    demo: golden
    note: >-
      The board stands at 40-40 with golden point. The switch changes to
      advantage.
  - title: "Doubles: serve changes after every game"
    text:
      - >-
        Serve alternates between the teams after every game, and within a team
        the partners take turns: whoever served the first game serves the fifth
        again.
      - >-
        Receiving sides (deuce side and advantage side) stay fixed for a whole
        set and may only be swapped for the next set.
  - title: "Serve: underarm, two attempts"
    text:
      - >-
        The ball is bounced once behind the service line and struck at or below
        waist height, diagonally into the opponents' service box. If the ball
        touches the wire fence after bouncing in the box it is a fault; if it
        hits the glass wall it stays in play.
  - title: "Sets: 6 games, tiebreak at 6-6"
    text:
      - >-
        A set goes to 6 games with a two-game margin; at 6-6 a tiebreak to 7
        points with a two-point margin follows. Serve changes after the first
        point and then every two points.
      - >-
        A match is normally best of three; many tournaments replace the third
        set with a match tiebreak to 10.
  - title: "Changing ends: as in tennis"
    text:
      - >-
        Players change ends after the first game, then whenever the game total
        is odd, and in the tiebreak every six points.
  - title: "Common formats: league, group stage, Americano"
    text:
      - >-
        League: two sets to win, golden point. Tournament group stage: often one
        set or a short set to 4 games (Kortscore plays its tiebreak at 3-3).
        Americano and Mexicano: a fixed number of points per round, usually 16,
        24 or 32, no games.
      - >-
        Kortscore counts singles and doubles, advantage and NoAd, sets to 4 or
        6, best of three or a single set.

# Sichtbares FAQ und FAQPage-JSON-LD kommen beide aus questions.
faq:
  title: Questions
  questions:
    - q: Who receives the golden point?
      a: >-
        The receiving team decides which partner receives, but has to keep its
        normal side split: each player receives from their own side.
    - q: Is padel always doubles?
      a: >-
        Almost always. Singles padel exists on narrower courts (six metres wide
        instead of ten) but is rare.
    - q: Does Kortscore score Americano tournaments?
      a: >-
        Not as a format of its own. Kortscore is for league and tournament
        matches with sets.

cta:
  title: Count with Kortscore
  text: >-
    You tap once per point; the app keeps track of games, sets and the tiebreak
    by exactly these rules.
